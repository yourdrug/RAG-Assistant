# docker-compose.prod.yml — deploy from GHCR image, no local build.
# Usage: task deploy -- 0.6.0
#
# NOTE: The base docker-compose.yml defines `build:` for server/worker/client.
# In prod override we set `image:` + `pull_policy: missing`.
# When both `build` and `image` are present, Docker Compose builds locally
# and tags with the given name — this is fine for `task up -- prod`.
# For remote deploy (`./deploy.sh`), `docker compose pull` fetches from GHCR.

services:
  migrate:
    image: ghcr.io/yourdrug/rag-assistant:production-cpu-${VERSION}
    pull_policy: missing

  server:
    image: ghcr.io/yourdrug/rag-assistant:production-cpu-${VERSION}
    pull_policy: missing

  worker:
    image: ghcr.io/yourdrug/rag-assistant:production-cpu-${VERSION}
    pull_policy: missing

  client:
    image: ghcr.io/yourdrug/rag-assistant/client:${VERSION}
    pull_policy: missing
