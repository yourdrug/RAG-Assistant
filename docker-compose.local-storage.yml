# Explicit persistent filesystem backend; omit this override when FILE_BACKEND=s3.
services:
  server:
    environment:
      FILE_BACKEND: local
      DATA_DIR: /code/project/data
    volumes:
      - ${LOCAL_DATA_DIR:-./data}:/code/project/data
  worker:
    environment:
      FILE_BACKEND: local
      DATA_DIR: /code/project/data
    volumes:
      - ${LOCAL_DATA_DIR:-./data}:/code/project/data
