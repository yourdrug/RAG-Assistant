# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-l",
    "-rsxX",
    "-v",
]

minversion = "8.3.3"
norecursedirs = ".venv .mypy_cache .pytest_cache data docs"
testpaths = ["tests"]

asyncio_default_fixture_loop_scope = "function"

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
    "security: marks security-sensitive tests",
]

python_classes = "*Test Test*"
python_files = "test_* *_test tests_* *_tests unit* *unit func* *func"
python_functions = "test_* *_test"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = ".coverage_report"

[tool.deptry]
known_first_party = ["application", "composition", "config", "domain", "infrastructure", "presentation", "shared"]
extend_exclude = ["app/infrastructure/database/migrations", "tests", "tools", "scripts"]

[tool.deptry.package_module_name_map]
"surya-ocr" = "surya"

[tool.deptry.per_rule_ignores]
# CLI entry points, database/OCR backends, and FastAPI/Pydantic plugins.
DEP002 = [
    "uvicorn", "asyncpg", "alembic", "psycopg", "email-validator",
    "paddlepaddle", "python-multipart", "torch",
    # Temporary dependency debt; see ../LINT_DEBT.md.
    "alembic_postgresql_enum", "python-dateutil",
]   # используются неявно (запуск/драйвер)

# Temporary transitive imports; remove when declared as direct dependencies.
DEP003 = ["openai", "langchain_core", "numpy", "starlette"]

# ----------------------------------------------------------------------------
# vulture: мёртвый код
# ----------------------------------------------------------------------------
[tool.vulture]
paths = ["app"]
# Temporary exact legacy files; see ../LINT_DEBT.md.
exclude = [
    "app/infrastructure/database/migrations/",
    "app/config.py",
    "app/infrastructure/benchmark/judge.py",
    "app/infrastructure/benchmark/metrics.py",
    "app/infrastructure/events/postgres_config_listener.py",
    "app/infrastructure/events/postgres_outbox_listener.py",
    "app/infrastructure/ml/clients/client_registry.py",
    "app/infrastructure/ml/ingestion/splitting.py",
    "app/presentation/api/schemas/admin_quality.py",
]
min_confidence = 80
ignore_decorators = [
    "@router.*",
    "@app.*",
    "@*.exception_handler",
    "@*.on_event",
    "@pydantic.*",
    "@field_validator",
    "@model_validator",
    "@computed_field",
    "@asynccontextmanager",
]
ignore_names = ["model_config", "model_post_init"]
