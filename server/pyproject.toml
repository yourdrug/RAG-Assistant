]

[[tool.importlinter.contracts]]
name = "Identity: declared application dependencies"
type = "forbidden"
source_modules = ["application.identity"]
allow_indirect_imports = true
# Allowed features: uow.
forbidden_modules = [
    "application.budget", "application.admin", "application.benchmark",
