    "application.uow", "application.budget", "application.admin",
    "application.benchmark", "application.act_versioning", "application.identity",
    "application.chat", "application.search", "application.indexing",
    "application.documents", "application.chunks", "application.ingestion",
    "application.health", "application.jobs",
]


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["app"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-l",
    "-rsxX",
    "-v",
]

minversion = "8.3.3"
norecursedirs = ".venv .mypy_cache .pytest_cache .hypothesis data docs"
testpaths = ["tests"]

asyncio_default_fixture_loop_scope = "function"

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
    "security: marks security-sensitive tests",
]

python_classes = "*Test Test*"
python_files = "test_* *_test tests_* *_tests unit* *unit func* *func"
python_functions = "test_* *_test"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = ".coverage_report"

[tool.deptry]
known_first_party = ["application", "composition", "config", "domain", "infrastructure", "presentation", "shared"]
extend_exclude = ["app/infrastructure/database/migrations", "tests", "tools", "scripts"]

[tool.deptry.package_module_name_map]
"surya-ocr" = "surya"

[tool.deptry.per_rule_ignores]
# CLI entry points, database/OCR backends, and FastAPI/Pydantic plugins.
DEP002 = [
    "uvicorn", "asyncpg", "alembic", "psycopg", "email-validator",
    "paddlepaddle", "python-multipart", "torch",
]   # используются неявно (запуск/драйвер)

# ----------------------------------------------------------------------------
# vulture: мёртвый код
# ----------------------------------------------------------------------------
[tool.vulture]
paths = ["app"]
min_confidence = 80
ignore_decorators = [
    "@router.*",
    "@app.*",
    "@*.exception_handler",
    "@*.on_event",
    "@pydantic.*",
    "@field_validator",
    "@model_validator",
    "@computed_field",
    "@asynccontextmanager",
]
ignore_names = ["model_config", "model_post_init"]


[[tool.importlinter.contracts]]
name = "RAG: declared application dependencies"
type = "forbidden"
source_modules = ["application.rag"]
allow_indirect_imports = true
forbidden_modules = [
    "application.budget", "application.admin", "application.benchmark", "application.act_versioning",
    "application.identity", "application.chat", "application.search", "application.indexing",
    "application.documents", "application.chunks", "application.ingestion", "application.health",
    "application.jobs", "application.uow", "application.ports",
    "langchain", "langchain_core", "langchain_openai",
]


[[tool.importlinter.contracts]]
name = "Runtime: declared application dependencies"
type = "forbidden"
source_modules = ["application.runtime"]
allow_indirect_imports = true
forbidden_modules = [
    "application.budget", "application.admin", "application.benchmark", "application.act_versioning",
    "application.identity", "application.chat", "application.search", "application.indexing",
    "application.documents", "application.chunks", "application.ingestion", "application.health",
    "application.jobs", "application.uow", "application.ports", "application.rag",
]
