    "application.ingestion.sync -> application.documents.delete",
    "application.ingestion.loader -> application.ports.file_storage",
    "application.ingestion.registry -> application.ports.file_storage",
    "application.ingestion.single_file -> application.ports.file_storage",
    "application.ingestion.targets -> application.ports.file_storage",
]

