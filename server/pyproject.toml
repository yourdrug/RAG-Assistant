[[tool.importlinter.contracts]]
name = "Documents: declared application dependencies"
type = "forbidden"
source_modules = ["application.documents"]
allow_indirect_imports = true
# Allowed features: act_versioning, identity, indexing, ingestion, uow.
forbidden_modules = [
    "application.budget", "application.admin", "application.benchmark",
    "application.chat", "application.search", "application.chunks",
    "application.health", "application.jobs", "application.ports",
]
# Only these shared ports are part of this feature boundary.
ignore_imports = [
    "application.documents.delete -> application.ports.file_storage",
    "application.documents.delete_job -> application.ports.action_logger",
    "application.documents.delete_job -> application.ports.cache_invalidator",
    "application.documents.deletion_jobs -> application.ports.job_enqueuer",
    "application.documents.preview_cache -> application.ports.file_storage",
