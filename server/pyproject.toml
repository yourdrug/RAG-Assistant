[project]
name = "rag-api"
version = "0.1.0"

requires-python = "==3.11.*"

description = "Корпоративный RAG-ассистент — FastAPI + Qdrant + Ollama, локальный стек"
readme = "../README.md"

authors = [
    { name = "RAG Team" },
]

license = { text = "Elastic-2.0" }

dependencies = [
    # --- Frameworks ---
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.12",
    # --- Validation ---
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    # --- Database ---
    "sqlalchemy==2.0.35",
    "alembic>=1.14.0",
    "alembic_postgresql_enum>=1.3.0",
    "psycopg2-binary==2.9.9",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    # --- ML / RAG ---
    "langchain==0.3.7",
    "langchain-ollama==0.2.1",
    "langchain-openai>=0.2.0",
    "qdrant-client==1.11.3",
    # --- OCR ---
    "paddlepaddle==2.6.2",
    "paddleocr==2.9.1",
    "pillow==10.4.0",
    # --- Document parsers ---
    "pymupdf==1.24.13",
    "python-docx==1.1.2",
    "striprtf==0.0.26",
    # --- Auth ---
    "bcrypt==4.2.1",
    "pyjwt==2.10.1",
    # --- Storage (S3 / MinIO) ---
    "boto3>=1.34.0",
    # --- Queue / Redis ---
    "arq>=0.26.0",
    "redis>=5.0.0",
    # --- Utilities ---
    "httpx==0.27.0",
    "python-json-logger>=3.2.1",
    # --- Metrics ---
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # --- Scheduler ---
    "apscheduler>=3.10.0",
    # --- Rate limiting ---
    "fastapi-limiter==0.1.6",
    # --- CLI ---
    "typer>=0.12.0",
    # --- Structured LLM output ---
    "instructor>=1.7.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
surya = [
    "surya-ocr==0.9.0",
]

cpu = [
    "torch>=2.0.0",
]

gpu = [
    "torch>=2.0.0",
]

[dependency-groups]
testing = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.0",
]

development = [
    "ruff==0.7.4",
    "mypy==1.14.1",
    "pre-commit>=4.0.0",
]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------

[tool.uv]
managed = true
package = false
python-preference = "only-managed"

concurrent-downloads = 10

environments = ["sys_platform == 'linux'"]
required-environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
default = false
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu124"
default = false
explicit = true

[tool.uv.extra-build-dependencies]
grpcio-tools = ["setuptools<81"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py311"

fix = false
indent-width = 4

include = ["*.py"]

[tool.ruff.lint]
select = ["B", "B9", "C", "D", "E", "F", "W"]
ignore = [
    "D1",       # missing docstrings (too many to fix now)
    "D203",     # one-blank-line-before-class (incompatible with D211)
    "D212",     # multi-line-summary-first-line (incompatible with D213)
    "D213",     # multi-line-summary-second-line (incompatible with D212)
    "B008",     # function calls in argument defaults (FastAPI Depends/Query pattern)
]

[tool.ruff.lint.per-file-ignores]
"app/infrastructure/database/migrations/*" = ["E501", "D400", "D415"]
"app/infrastructure/database/database.py" = ["D"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "preserve"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"

check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_return_any = false

plugins = ["pydantic.mypy"]

exclude = [
    "tests/",
    "app/infrastructure/database/migrations/",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-l",
    "-rsxX",
    "-v",
]

minversion = "8.3.3"
norecursedirs = ".venv .mypy_cache .pytest_cache data docs"
testpaths = ["tests"]

asyncio_default_fixture_loop_scope = "function"

python_classes = "*Test Test*"
python_files = "test_* *_test tests_* *_tests unit* *unit func* *func"
python_functions = "test_* *_test"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = ".coverage_report"
