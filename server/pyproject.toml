[project]
name = "rag-api"
version = "0.1.0"

requires-python = "==3.12.*"

description = "Корпоративный RAG-ассистент — FastAPI + Qdrant + Ollama, локальный стек"
readme = "../README.md"

authors = [
    { name = "RAG Team" },
]

license = { text = "Elastic-2.0" }

dependencies = [
    # --- Frameworks ---
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.12",
    # --- Validation ---
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1", # Existing parser, now used directly by the migration CLI
    "email-validator>=2.0.0",
    # --- Database ---
    "sqlalchemy==2.0.35",
    "alembic>=1.14.0",
    "alembic_postgresql_enum>=1.3.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    # --- ML / RAG ---
    "langchain==0.3.7",
    "langchain-ollama==0.2.1",
    "langchain-openai>=0.2.0",
    "qdrant-client==1.11.3",
    # --- OCR ---
    "paddlepaddle==2.6.2",
    "paddleocr==2.9.1",
    "pillow==10.4.0",
    # --- Document parsers ---
    "pymupdf==1.24.13",
    "python-docx==1.1.2",
    "striprtf==0.0.26",
    "mammoth>=1.8.0",
    # --- Auth ---
    "bcrypt==4.2.1",
    "pyjwt==2.10.1",
    # --- Storage (S3 / MinIO) ---
    "aiobotocore==3.9.2",
    "aiohttp==3.14.1",
    "botocore>=1.43.101,<1.43.107",
    # --- Queue / Redis ---
    "arq>=0.26.0",
    # NOTE: arq caps redis<6, so redis 5.x stays. pyrate-limiter is installed
    # without the [redis] extra (which would force redis>=6.2); its RedisBucket
    # only uses redis-py APIs present in 5.x.
    "redis>=5.0.0",
    # --- Rate limiting ---
    "pyrate-limiter==4.5.0",
    # --- Utilities ---
    "httpx==0.27.0",
    "python-json-logger>=3.2.1",
    "python-dateutil>=2.9.0",
    # --- Metrics ---
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # --- Scheduler ---
    "apscheduler>=3.10.0",
    # --- CLI ---
    "typer>=0.12.0",
    # --- Structured LLM output ---
    "instructor>=1.7.0",
    "tenacity>=9.0.0",
    # --- Hyperparameter optimization ---
    "optuna>=4.0.0",
]

[project.optional-dependencies]
surya = [
    "surya-ocr==0.9.0",
]

cpu = [
    "torch>=2.0.0",
]

gpu = [
    "torch>=2.0.0",
]

[dependency-groups]
testing = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "fakeredis[lua]>=2.26.0",
    "pytest-cov>=6,<8",
]

development = [
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "pre-commit>=4.0.0",
    "import-linter>=2.5,<3",
    "deptry>=0.23,<1",
    "vulture>=2.14,<3",
    "libcst>=1.8,<2",
]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------

[tool.uv]
managed = true
package = false
python-preference = "system"

conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }],
]

concurrent-downloads = 10

environments = ["sys_platform == 'linux'"]
required-environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
default = false
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
default = false
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[tool.uv.extra-build-dependencies]
grpcio-tools = ["setuptools<81"]

[tool.ruff]
extend = "ruff-baseline.toml"
line-length = 110
target-version = "py312"
src = ["app", "tests", "tools"]
force-exclude = true
output-format = "grouped"
show-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
# Включаем ВСЕ правила и точечно отключаем только то, что конфликтует или бессмысленно.
select = ["ALL"]
ignore = [
    # --- конфликты с форматтером (рекомендация самого ruff) ---
    "COM812", # trailing comma: конфликтует с ruff format
    "ISC001", # implicit string concat: конфликтует с ruff format

    # --- взаимоисключающие правила pydocstyle ---
    "D203", # конфликтует с D211
    "D213", # конфликтует с D212

    # --- мета-правила, не про качество кода ---
    "CPY001", # copyright header
    "TD002", # TODO без автора
    "TD003", # TODO без ссылки на issue
    "FIX002", # TODO в коде

    # --- докстринги ---
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]
fixable = ["ALL"]
unfixable = [
    "F841", # не удалять неиспользуемые переменные молча
    "ERA001", # не удалять закомментированный код автоматически
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert
    "PLR2004", # magic values в assert
    "ANN", # аннотации в тестах
    "D", # докстринги
    "SLF001", # доступ к приватным атрибутам
    "ARG001", # неиспользуемые аргументы (фикстуры)
    "FBT", # boolean-аргументы
    "INP001", # нет __init__.py
]
"app/infrastructure/database/migrations/**" = ["D", "INP001", "E501", "ANN", "ERA001"]
# FastAPI резолвит типы параметров в рантайме, поэтому импорты нельзя прятать под TYPE_CHECKING
"app/presentation/**" = ["TC001", "TC002", "TC003"]
"app/composition/**" = ["TC001", "TC002", "TC003"]
"__init__.py" = ["F401", "D104"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/... в дефолтах аргументов не считаются B008.
# Если используете dishka / dependency-injector, добавьте их маркеры (FromDishka, Provide и т.п.)
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-type-checking]
strict = true
# Эти классы читают аннотации в рантайме, импорты типов должны быть обычными.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "sqlalchemy.orm.DeclarativeBaseNoMeta",
]
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true
suppress-none-returning = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "pydantic.field_validator",
    "pydantic.model_validator",
]

[tool.ruff.lint.isort]
known-first-party = ["application", "composition", "config", "domain", "infrastructure", "presentation", "shared"]
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 7            # DI-конструкторы часто длинные; не ставьте меньше без нужды
max-positional-args = 5
max-branches = 10
max-returns = 4
max-statements = 30
max-public-methods = 15

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "tools"]
exclude = ["app/infrastructure/database/migrations/"]
mypy_path = "app"
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

strict = true                  # включает disallow_untyped_defs, disallow_any_generics,
# warn_return_any, no_implicit_reexport и т.д.
disallow_any_unimported = true
disallow_any_decorated = false # включите, если готовы бороться с декораторами FastAPI
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
local_partial_types = true
strict_equality = true
extra_checks = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "possibly-undefined",
    "ignore-without-code",
    "unused-awaitable",
    "redundant-self",
    "mutable-override",
    "deprecated",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false   # pytest-фикстуры
disallow_any_decorated = false

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

# Библиотеки без типов добавляйте сюда:
# [[tool.mypy.overrides]]
# module = ["some_lib.*"]
# ignore_missing_imports = true


