# Trust only the host reverse proxy address, configured on the deployment host.
set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Real-IP;
real_ip_recursive off;

map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    https https;
    http http;
}

limit_req_zone $binary_remote_addr zone=chat_zone:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=upload_zone:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=ingest_zone:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m   rate=10r/m;

limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Too Many Requests"}';
    }

    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;

        proxy_pass http://${UPSTREAM_SERVER}/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
    }

    location /api/chat {
        limit_req zone=chat_zone burst=10 nodelay;

        proxy_pass http://${UPSTREAM_SERVER}/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location /api/documents/upload {
        limit_req zone=upload_zone burst=5 nodelay;

        proxy_pass http://${UPSTREAM_SERVER}/documents/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        client_max_body_size 100m;
    }

    location /api/ingest {
        limit_req zone=ingest_zone burst=5 nodelay;

        proxy_pass http://${UPSTREAM_SERVER}/ingest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
    }

    # Остальной /api/* — без лимита или с общим мягким лимитом при желании
    location /api/ {
        proxy_pass http://${UPSTREAM_SERVER}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
