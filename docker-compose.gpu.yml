# GPU override — подключает nvidia runtime для ollama, server, tei-embed и tei-rerank.
# Использование: task up -- gpu
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

  server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.5
    environment:
      USE_FLASH_ATTENTION: "True"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
        limits:
          memory: 4G

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.5
    command: --model-id /data/bge-reranker-v2-m3 --port 8080
    environment:
      USE_FLASH_ATTENTION: "True"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
        limits:
          memory: 4G
