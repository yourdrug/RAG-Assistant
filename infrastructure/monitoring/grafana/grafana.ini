[server]
http_addr         = "0.0.0.0"
http_port         = 3000
domain            = localhost
root_url          = http://localhost:16506

[paths]
provisioning      = /etc/grafana/provisioning

[security]
admin_user        = ${GRAFANA_USER}
admin_password    = ${GRAFANA_PASS}

[database]
type              = sqlite3

[dataproxy]
timeout           = 310

[news]
news_feed_enabled = false
