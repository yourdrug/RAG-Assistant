server:
  http_listen_address: "0.0.0.0"
  http_listen_port: 9080
  health_check_target: true

positions:
  filename: /var/lib/promtail/positions/positions.yaml
  sync_period: 10s

clients:
  - url: ${LOKI_URL}/loki/api/v1/push

scrape_configs:
  - job_name: containers

    static_configs:
      - labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            project: attrs."com.docker.compose.project"
            service: attrs."com.docker.compose.service"
            time: time

      - labels:
          project:
          service:

      - timestamp:
          source: time
          format: RFC850
          location: "Europe/Moscow"

      - match:
          selector: '{service!="",project!=""}'

          stages:
            - json:
                expressions:
                  row: log

            - output:
                source: row

            - multiline:
                firstline: '^\[(?P<time>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2})\] (?P<severity>.*?):'
                max_lines: 128
                max_wait_time: 3s

            - regex:
                expression: '^\[(?P<time>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2})\] (?P<severity>.*?):'

            - labels:
                severity:
