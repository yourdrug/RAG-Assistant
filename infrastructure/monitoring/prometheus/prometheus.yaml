global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 1m

scrape_configs:
  - job_name: node-exporter
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres-exporter
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: rag-server
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ["server:8001"]
