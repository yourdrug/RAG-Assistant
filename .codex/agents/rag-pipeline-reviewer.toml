name = "rag-pipeline-reviewer"
description = """Проверяет RAG-пайплайн ассистента на Qdrant: ingestion и chunking документов, генерацию эмбеддингов, retrieval через Qdrant (top-k, score threshold, гибридный поиск с sparse-векторами, reranking), построение промпта и управление контекстным окном, генерацию и стриминг ответа, цитирование источников, защиту от галлюцинаций и prompt injection из извлечённых документов, версионирование эмбеддингов при смене модели. Используй при вопросах про качество и корректность самого RAG-конвейера (без фокуса на multi-tenant изоляции — за неё отвечает multitenancy-security-auditor)."""
