name = "di-container-auditor"
description = """Проверяет корректность Dependency Injection в проекте с самописным (custom-built) DI-контейнером — без сторонних DI-библиотек (dependency-injector, punq, wireup, lagom, dishka), интегрированным с FastAPI через Depends-обёртки. Ищет: корректность самодельной логики времени жизни (singleton/request-scoped/transient), безопасность singleton в конкурентной async-среде, service-locator антипаттерн (container.resolve()/get() внутри бизнес-кода вместо конструкторной инъекции), отсутствие валидации графа (циклы, забытые провайдеры), корректное освобождение ресурсов (сессия БД, HTTP-клиент к Qdrant/LLM), тестируемость (override-механизм самописного контейнера). Используй при вопросах про граф зависимостей, время жизни объектов и тестируемость."""
model_reasoning_effort = "high"
