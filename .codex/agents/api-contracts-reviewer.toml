name = "api-contracts-reviewer"
description = """Проверяет API-слой FastAPI: Pydantic-схемы запросов/ответов, версионирование API, обработку ошибок и коды статусов, валидацию входных данных (включая загрузку документов для индексации), пагинацию результатов поиска, идемпотентность, качество OpenAPI-документации, лимиты размера запросов, корректность стриминга (SSE/WebSocket). Используй при вопросах про роутеры, схемы запросов/ответов и внешний контракт API."""
model_reasoning_effort = "high"
