name: Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen --group development --group testing

      - name: Ruff check
        working-directory: server
        run: uv run ruff check app tests

      - name: Ruff format check
        working-directory: server
        run: uv run ruff format --check app tests

      - name: Mypy type check
        working-directory: server
        run: uv run mypy app

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d rag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATA_DIR: /tmp/rag_test
      TEST_POSTGRES_URL: postgresql+asyncpg://test:test@localhost:5432/rag_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen --group development --group testing

      - name: Run tests
        working-directory: server
        run: >-
          uv run pytest -v
          --cov=domain.services.access_control
          --cov=infrastructure.ml.answer_cache
          --cov-report=term-missing --cov-fail-under=85

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run check
        working-directory: client
