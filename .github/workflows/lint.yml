name: Lint & Test

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Called from build.yml the context is the caller's, so the group differs from standalone runs.
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen --group development --group testing

      - name: Python validation (all checks)
        working-directory: server
        run: |
          status=0
          uv run python tools/blank_lines.py --check app tests tools || status=1
          uv run ruff check app tests tools typings || status=1
          uv run ruff format --check app tests tools typings || status=1
          uv run mypy || status=1
          PYTHONPATH=app uv run lint-imports || status=1
          uv run deptry . || status=1
          uv run vulture || status=1
          exit "$status"

  test:
    runs-on: ubuntu-24.04
    needs: lint
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d rag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATA_DIR: /tmp/rag_test
      TEST_POSTGRES_URL: postgresql+asyncpg://test:test@localhost:5432/rag_test
      TEST_WORKER_REDIS_URL: redis://localhost:6379/15
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen --group development --group testing

      - name: Check migration baseline (upgrade, schema parity, downgrade)
        working-directory: server
        run: uv run pytest tests/integration/test_migration_schema.py -q

      - name: Check worker reliability (PostgreSQL and Arq)
        working-directory: server
        env:
          # Enables the real Redis restart test (docker restart of the service container).
          TEST_REDIS_URL: redis://localhost:6379/14
          TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: >-
          uv run pytest -v
          tests/integration/test_postgres_transactions.py
          tests/integration/test_worker_queues.py
          tests/integration/test_configuration_corpus_postgres.py

      - name: Run tests
        working-directory: server
        run: >-
          uv run pytest -v
          --ignore=tests/integration/test_migration_schema.py
          --ignore=tests/integration/test_worker_queues.py
          --ignore=tests/integration/test_postgres_transactions.py
          --ignore=tests/integration/test_configuration_corpus_postgres.py
          --cov=domain.knowledge.access_control
          --cov=infrastructure.repositories.vector.acl
          --cov=infrastructure.ml.cache.keys
          --cov-report=term-missing:skip-covered --cov-fail-under=85

      - name: Coverage summary
        # The ACL / answer-cache-key gate as a table on the run page instead of the end of the -v log.
        if: always()
        working-directory: server
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Coverage gate: ACL and answer cache key (min 85%)"
              uv run coverage report --format=markdown
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  offline-gate:
    # Chunking and BM25 recall of the packs whose corpora are in the repository; no LLM, no network
    # services. The belarus_law corpus is local only, so that pack stays a PR checklist step.
    runs-on: ubuntu-24.04
    needs: lint
    env:
      PYTHONPATH: app
      DATA_DIR: /tmp/rag_offline_gate
      # Settings are validated at import; the gate touches none of these services.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: offline
      DB_PASSWORD: offline
      DB_NAME: offline
      ALLOWED_ORIGINS: "*"
      JWT_SECRET_KEY: offline-gate-placeholder-secret-0000
      REDIS_PASSWORD: offline-gate-redis-password
      S3_ACCESS_KEY: offline-gate-access
      S3_SECRET_KEY: offline-gate-secret-value
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen

      - name: Fetch the bge-m3 tokenizer (pinned revision and checksum)
        run: |
          curl -fsSL -o /tmp/bge-m3-tokenizer.json \
            https://huggingface.co/BAAI/bge-m3/resolve/5617a9f61b028005a4858fdac845db406aefb181/tokenizer.json
          echo "21106b6d7dab2952c1d496fb21d5dc9db75c28ed361a05f5020bbba27810dd08  /tmp/bge-m3-tokenizer.json" \
            | sha256sum -c -

      - name: Offline quality gate (support, internal)
        working-directory: server
        # Same loop as `task quality:offline-gate PACKS="support internal"`.
        run: |
          status=0
          for pack in support internal; do
            echo "== $pack"
            uv run python ../scripts/benchmark/chunking_report.py --pack "$pack" \
              --tokenizer /tmp/bge-m3-tokenizer.json \
              --thresholds "server/app/infrastructure/domain_packs/$pack/benchmarks/acceptance.json" \
              --baseline "docs/quality/artifacts/offline-gate/$pack.json" --gate 0.02 || status=1
          done
          exit "$status"

  client-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run check
        working-directory: client
