# Dev-override: local builds + live-reload bind-mounts.
# Auto-loaded by `docker compose up` (Compose convention for override files).
# Production deploys skip this file by using explicit -f flags.

services:
  migrate:
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        read_only: true
        bind:
          create_host_path: false
          selinux: Z

  server:
    # Host VPN DNS is unreachable from Docker; keep external lookups container-local.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build:
      context: .
      dockerfile: Dockerfile
      target: ${STAGE}-${BUILD_TARGET}
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: server/entrypoint.sh
        target: /code/project/entrypoint.sh
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z

  worker:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: server/entrypoint.sh
        target: /code/project/entrypoint.sh
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
