# Dev-override: local builds + live-reload bind-mounts.
# Auto-loaded by `docker compose up` (Compose convention for override files).
# Production deploys skip this file by using explicit -f flags.

services:
  migrate:
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        read_only: true
        bind:
          create_host_path: false
          selinux: Z

  server:
    # Direct API access for local tools (Taskfile); dev runs a single replica.
    ports:
      - "127.0.0.1:8001:8001"
    # Host VPN DNS is unreachable from Docker; keep external lookups container-local.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build:
      context: .
      dockerfile: Dockerfile
      target: ${STAGE}-${BUILD_TARGET}
      # Bridge-network builds cannot resolve PyPI behind the host VPN DNS; a failed
      # uv sync used to leave an empty venv (no alembic for the migrate service).
      network: host
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: server/entrypoint.sh
        target: /code/project/entrypoint.sh
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z

  worker:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: server/entrypoint.sh
        target: /code/project/entrypoint.sh
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z

  worker-batch:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: server/entrypoint.sh
        target: /code/project/entrypoint.sh
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z

  maintenance:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: server/entrypoint.sh
        target: /code/project/entrypoint.sh
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      # Same as server: bridge-network builds cannot resolve the Alpine/npm mirrors.
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL}
