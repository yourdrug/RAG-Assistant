version: "3"

vars:
  COMPOSE: docker compose
  # Compose project name (named volumes are prefixed with it): COMPOSE_PROJECT_NAME or the directory name.
  PROJECT:
    sh: printf '%s' "${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_-'
  VERSION:
    sh: cat VERSION

dotenv: [ "server/.env", "server/.env.secrets", "client/.env" ]

env:
  VERSION: "{{.VERSION}}"
  # Bake rejects build.network=host (docker-compose.override.yml) without --allow=network.host.
  COMPOSE_BAKE: "false"

tasks:

  default:
    desc: Показать список доступных команд
    cmds:
      - task --list

  # -------------------------------------------------------------------------
  # Первый запуск
  # -------------------------------------------------------------------------

  init:
    desc: Первоначальная настройка — server/.env + client/.env + права на data/ + сборка образа
    cmds:
      - task: env
      - task: data:create
      - task: data:perms
      - task: build
      - 'echo "Готово. Дальше:  task up  →  task login email=... password=...  →  task ingest  →  task chat -- \"вопрос\""'
      - 'echo "(Для GPU: измените BUILD_TARGET=gpu в server/.env)"'

  setup:
    desc: Подготовить новое устройство для разработки — env-шаблоны, uv-зависимости, git hooks, graphify
    cmds:
      - task: env
      - task: install
      - task: hooks:install
      - |
        if command -v graphify >/dev/null 2>&1; then
          graphify hook install
        else
          echo "graphify не найден: установите его и выполните graphify hook install && graphify update ."
        fi
      - 'echo "Не переносится через git: секреты в server/.env.secrets, данные data/ (Postgres, Qdrant, MinIO), graphify-out/, backups/, .deploy/"'

  env:
    desc: Создать env и secret env из шаблонов без перезаписи существующих файлов
    status:
      - test -f server/.env
      - test -f client/.env
      - test -f server/.env.secrets
      - test "$(stat -c %a server/.env.secrets)" = 600
    cmds:
      - test -f server/.env || cp server/.env.example server/.env
      - test -f client/.env || cp client/.env.example client/.env
      - test -f server/.env.secrets || install -m 600 server/.env.secrets.example server/.env.secrets
      - chmod 600 server/.env.secrets
      - 'echo "server/.env, server/.env.secrets (0600) и client/.env готовы; заполните секреты перед task up"'

  data:create:
    desc: Создать все data-директории, необходимые для Docker-сервисов
    cmds:
      - mkdir -p data/qdrant_storage data/postgres data/minio data/paddleocr_cache data/db/postgres data/redis
      - test -f data/redis/redis.conf || echo '# See data/redis/redis.conf in repo' > data/redis/redis.conf
      - 'echo "Data-директории созданы"'

  data:perms:
    desc: "Назначить владельцев и закрыть доступ к данным для посторонних пользователей (sudo)"
    cmds:
      - sudo ./scripts/operations/data-permissions.sh

  # -------------------------------------------------------------------------
  # Docker-стек
  # -------------------------------------------------------------------------

  build:
    desc: Собрать образы
    cmds:
      - >
        {{.COMPOSE}} -f docker-compose.yml
        -f docker-compose.override.yml
        build server client

  up:
    desc: "Поднять стек; опционально: task up -- vllm | ocr-vl (GPU-профили) | gpu (GPU для TEI/server), можно несколько"
    cmds:
      - task: data:create
      - |
        FILES="-f docker-compose.yml -f docker-compose.override.yml"
        # --profile в CLI заменяет COMPOSE_PROFILES, поэтому дополняем переменную (например, tei из server/.env).
        PROFILES="${COMPOSE_PROFILES:-}"
        for extra in {{.CLI_ARGS}}; do
          case "$extra" in
            vllm|ocr-vl) PROFILES="${PROFILES:+$PROFILES,}$extra" ;;
            gpu) FILES="$FILES -f docker-compose.gpu.yml" ;;
            *) echo "Неизвестная опция: $extra (vllm | ocr-vl | gpu)" >&2; exit 1 ;;
          esac
        done
        COMPOSE_PROFILES="$PROFILES" {{.COMPOSE}} $FILES up -d
      - task: ps

  ocr-vl:models:
    desc: Однократно скачать модели PaddleOCR-VL в volume (сервис работает в сети backend без интернета)
    cmds:
      - "{{.COMPOSE}} --profile ocr-vl build ocr-vl"
      # docker run (не compose run): сеть backend внутренняя, а загрузке нужен интернет.
      - >
        docker run --rm -v {{.PROJECT}}_ocr_vl_models:/root/.paddlex --entrypoint python
        ${OCR_VL_IMAGE:-rag-ocr-vl:latest} -c "from paddlex.inference.utils.official_models import official_models as m;
        [m.get_model_path(n) for n in ('PP-LCNet_x1_0_doc_ori', 'UVDoc', 'PP-DocLayoutV3', 'PaddleOCR-VL-1.6')]"

  vllm:models:
    desc: "Однократно скачать модель vLLM в volume (VLLM_MODEL, по умолчанию Qwen/Qwen2.5-3B-Instruct-AWQ)"
    cmds:
      - >
        docker run --rm -e HF_HUB_DISABLE_XET=1 -v {{.PROJECT}}_vllm_models:/root/.cache/huggingface --entrypoint hf
        vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.10.1.1} download ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}

  gpu:stop:
    desc: "Остановить опциональные GPU-сервисы (task gpu:stop -- vllm | ocr-vl), основной стек не трогается"
    cmds:
      - |
        for service in {{.CLI_ARGS | default "ocr-vl vllm"}}; do
          {{.COMPOSE}} stop "$service"
        done

  down:
    desc: Остановить и удалить контейнеры (данные в data/ сохраняются)
    cmds:
      - "{{.COMPOSE}} down"

  version:bump:
    desc: "Увеличить минорную версию (0.2.0 → 0.3.0) в VERSION и пересобрать образ"
    cmds:
      - |
        CURRENT=$(cat VERSION)
        MAJOR=$(echo $CURRENT | cut -d. -f1)
        MINOR=$(echo $CURRENT | cut -d. -f2)
        NEW_MINOR=$((MINOR + 1))
        NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
        echo $NEW_VERSION > VERSION
        echo "Version bumped: $CURRENT → $NEW_VERSION"
      - task: build

  version:set:
    desc: "Установить конкретную версию (task version:set -- 1.0.0)"
    cmds:
      - |
        NEW_VERSION="{{.CLI_ARGS}}"
        CURRENT=$(cat VERSION)
        echo $NEW_VERSION > VERSION
        echo "Version set: $CURRENT → $NEW_VERSION"
      - task: build

  version:show:
    desc: Показать текущую версию
    cmds:
      - 'echo "Current version: $(cat VERSION)"'

  release:
    desc: "Тегировать и запушить релиз (task release -- 0.6.0) — CI соберёт и запушит образ в GHCR"
    cmds:
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
      - 'echo "Tag {{.CLI_ARGS}} pushed — CI will push ghcr.io/yourdrug/rag-assistant:{{.CLI_ARGS}} and ghcr.io/yourdrug/rag-assistant/client:{{.CLI_ARGS}}"'

  deploy:
    desc: "Деплой на сервер (task deploy -- v0.6.0)"
    cmds:
      - ./deploy/deploy.sh {{.CLI_ARGS}}

  restart:
    desc: "Перезапустить сервис (task restart -- server)"
    cmds:
      - "{{.COMPOSE}} restart {{.CLI_ARGS | default \"server\"}}"

  ps:
    desc: Статус контейнеров
    cmds:
      - "{{.COMPOSE}} ps"

  logs:
    desc: "Логи сервиса, по умолчанию server (task logs -- postgres)"
    cmds:
      - "{{.COMPOSE}} logs -f {{.CLI_ARGS | default \"server\"}}"

  clean:
    desc: Остановить стек и удалить data/postgres, data/qdrant_storage,, data/redis — ОПАСНО
    prompt: Удалить все локальные данные (Postgres/Qdrant/Redis)?
    cmds:
      - "{{.COMPOSE}} down -v"
      - rm -rf data/postgres data/qdrant_storage data/redis

  # -------------------------------------------------------------------------
  # Проверка и использование
  # -------------------------------------------------------------------------

  bench:
    desc: "Оценка качества (retriever + LLM-судья) через worker по датасетам из БД; task bench -- -d quick-30 --no-wait"
    cmds:
      - "{{.COMPOSE}} exec server bash -c 'cd app && python -m composition.cli benchmark run {{.CLI_ARGS}}'"

  bench:regression:
    desc: Benchmark + regression check vs baseline (exit code 1 при regressions)
    cmds:
      - "{{.COMPOSE}} exec server bash -c 'cd app && python -m composition.cli benchmark regression'"

  bench:history:
    desc: Показать историю последних 10 runs бенчмарка
    cmds:
      - "{{.COMPOSE}} exec server bash -c 'cd app && python -m composition.cli benchmark history'"

  # -------------------------------------------------------------------------
  # База данных
  # -------------------------------------------------------------------------

  db:shell:
    desc: Открыть psql внутри контейнера postgres
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U {{.DB_USER}} -d {{.DB_NAME}}"

  # -------------------------------------------------------------------------
  # Alembic миграции
  # -------------------------------------------------------------------------

  db:migrate:
    desc: "Применить все pending миграции (alembic upgrade head)"
    cmds:
      - "{{.COMPOSE}} exec server alembic upgrade head"

  db:migrate:make:
    desc: "Создать новую миграцию (task db:migrate:make -- \"описание\")"
    aliases: [ mm ]
    cmds:
      - "{{.COMPOSE}} exec server alembic revision --autogenerate -m {{.CLI_ARGS}}"

  db:migrate:current:
    desc: Показать текущую версию миграций
    cmds:
      - "{{.COMPOSE}} exec server alembic current"

  db:migrate:history:
    desc: История миграций
    cmds:
      - "{{.COMPOSE}} exec server alembic history"

  db:migrate:downgrade:
    desc: "Откатить на одну миграцию вниз (alembic downgrade -1)"
    cmds:
      - "{{.COMPOSE}} exec server alembic downgrade -1"

  # -------------------------------------------------------------------------
  # Локальная разработка без Docker (uv)
  # -------------------------------------------------------------------------

  install:
    desc: "Установить зависимости локально через uv (основные + dev: pytest, ruff)"
    dir: server
    cmds:
      - uv sync --frozen --group development --group testing

  install:surya:
    desc: Доустановить опциональный OCR-движок Surya (см. README → «Лицензии»)
    dir: server
    cmds:
      - uv sync --frozen --extra surya

  lock:
    desc: Пересобрать uv.lock после правки pyproject.toml
    dir: server
    cmds:
      - uv lock

  hooks:install:
    desc: Установить pre-commit и pre-push hooks (сохраняет существующий Git LFS hook)
    cmds:
      - uv run --frozen --project server --group development pre-commit install --hook-type pre-commit --hook-type pre-push

  fmt:
    desc: Отформатировать код и пустые строки, применить безопасные исправления Ruff
    dir: server
    cmds:
      - |
        status=0
        uv run --frozen --group development ruff check --fix app tests tools typings || status=1
        uv run --frozen --group development python tools/blank_lines.py app tests tools || status=1
        uv run --frozen --group development ruff format app tests tools typings || status=1
        exit "$status"

  lint:
    desc: Все Python-проверки без изменения исходников (выполняет каждую даже при ошибках)
    dir: server
    cmds:
      - |
        status=0
        uv run --frozen --group development python tools/blank_lines.py --check app tests tools || status=1
        uv run --frozen --group development ruff check app tests tools typings || status=1
        uv run --frozen --group development ruff format --check app tests tools typings || status=1
        uv run --frozen --group development --group testing mypy || status=1
        PYTHONPATH=app uv run --frozen --group development lint-imports || status=1
        uv run --frozen --group development deptry . || status=1
        uv run --frozen --group development vulture || status=1
        exit "$status"

  test:
    desc: Прогнать unit-тесты (pytest)
    dir: server
    cmds:
      - uv run pytest -v -m "not integration" {{.CLI_ARGS}}

  test:integration:
    desc: Прогнать интеграционные тесты (требуются настроенные внешние сервисы)
    dir: server
    env:
      RUN_INTEGRATION_TESTS: "1"
    cmds:
      - uv run pytest -v -m integration {{.CLI_ARGS}}

  benchmark:validate:
    desc: "Проверить структуру benchmark v2 без запуска RAG"
    cmds:
      - python3 scripts/benchmark/validate_v2.py {{.CLI_ARGS}}

  chunking:report:
    desc: "Офлайн-замер нарезки без LLM (размеры, достижимость, BM25-recall); -- --dense добавляет bge-m3 через DeepInfra"
    dir: server
    env:
      PYTHONPATH: app
    cmds:
      - 'uv run python ../scripts/benchmark/chunking_report.py {{.CLI_ARGS}}'

  script:
    desc: "Запустить Python-утилиту из scripts/: task script SCRIPT=benchmark/compare_frozen_generation.py -- --help"
    dir: server
    requires:
      vars: [SCRIPT]
    env:
      PYTHONPATH: app
    cmds:
      - 'uv run python "../scripts/{{.SCRIPT}}" {{.CLI_ARGS}}'

  # -------------------------------------------------------------------------
  # Нагрузочное тестирование
  # -------------------------------------------------------------------------

  loadtest:setup-users:
    desc: "Создать тестовых пользователей для нагрузочных тестов (task loadtest:setup-users -- count=50)"
    dir: loadtest
    cmds:
      - >
        python3 data/generate_users.py
        --count {{.count | default "50"}}
        --base-url {{.url | default "http://localhost:8001"}}
        {{if .admin_email}}--admin-email {{.admin_email}}{{end}}
        {{if .admin_password}}--admin-password {{.admin_password}}{{end}}

  loadtest:smoke:
    desc: "Smoke test (1-5 VU, 1 мин) — проверка что сценарий работает"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/smoke.js
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:run:
    desc: "Нагрузочный тест (0→500 VU за 5 мин, 10 мин steady)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/load.js
        --out json=/results/results_load_{{now | date "20060102_150405"}}.json
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:spike:
    desc: "Spike test (50→500 VU за 30 сек)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/spike.js
        --out json=/results/results_spike_{{now | date "20060102_150405"}}.json
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:soak:
    desc: "Soak test (200 VU на 1 час — поиск утечек памяти)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/soak.js
        --out json=/results/results_soak_{{now | date "20060102_150405"}}.json
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:breakpoint:
    desc: "Breakpoint test (постепенный рост до отказа)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/breakpoint.js
        --out json=/results/results_breakpoint_{{now | date "20060102_150405"}}.json
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:sse:
    desc: "Locust SSE test — тестирование /chat streaming (task loadtest:sse -- users=200 duration=10m)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile locust run --rm locust
        -f locustfile.py --headless
        --users {{.users | default "200"}}
        --spawn-rate {{.spawn_rate | default "10"}}
        --run-time {{.duration | default "10m"}}
        --csv=/results/locust_{{now | date "20060102_150405"}}
        --html=/results/locust_report_{{now | date "20060102_150405"}}.html
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'
      LOCUST_USERS: '{{.users | default "200"}}'
      LOCUST_SPAWN_RATE: '{{.spawn_rate | default "10"}}'
      LOCUST_RUN_TIME: '{{.duration | default "10m"}}'
