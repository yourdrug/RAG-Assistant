version: "3"

vars:
  COMPOSE: docker compose
  VERSION:
    sh: cat VERSION

dotenv: [ "server/.env" ]

tasks:

  default:
    desc: Показать список доступных команд
    cmds:
      - task --list

  # -------------------------------------------------------------------------
  # Первый запуск
  # -------------------------------------------------------------------------

  init:
    desc: Первоначальная настройка — .env файлы + права на data/ + сборка образа
    cmds:
      - task: env
      - task: data:create
      - task: data:perms
      - task: build
      - 'echo "Готово. Дальше:  task up  →  task pull-model  →  task login email=... password=...  →  task ingest  →  task chat -- \"вопрос\""'
      - 'echo "Свой домен вместо localhost:8001?  task up -- public  (нужен DOMAIN в .env — см. README)"'
      - 'echo "(Для GPU: task up -- gpu, для prod: task up -- prod)"'

  env:
    desc: Создать .env и server/.env из соответствующих .env.example, если ещё не созданы
    status:
      - test -f .env
      - test -f server/.env
    cmds:
      - test -f .env || cp .env.example .env
      - test -f server/.env || cp server/.env.example server/.env
      - 'echo ".env и server/.env готовы"'

  data:create:
    desc: Создать все data-директории, необходимые для Docker-сервисов
    cmds:
      - mkdir -p data/qdrant_storage data/ollama_models data/postgres data/minio data/nginx_certs data/paddleocr_cache data/db/postgres data/redis
      - test -f data/redis/redis.conf || echo '# See data/redis/redis.conf in repo' > data/redis/redis.conf
      - 'echo "Data-директории созданы"'

  data:perms:
    desc: "Права на data/ для записи любым UID контейнера (нужно для task prod:up / production-стадии)"
    cmds:
      - task: data:create
      - chmod -R a+rwX data
      - 'echo "data/ доступна на запись"'

  # -------------------------------------------------------------------------
  # Docker-стек
  # -------------------------------------------------------------------------

  build:
    desc: "Собрать образы (task build -- [gpu] [prod])"
    cmds:
      - >
        {{.COMPOSE}} -f docker-compose.yml
        {{if not (contains "prod" .CLI_ARGS)}}-f docker-compose.dev.yml{{end}}
        {{if contains "gpu" .CLI_ARGS}}-f docker-compose.gpu.yml{{end}}
        build server client
    env:
      BUILD_TARGET: '{{if contains "gpu" .CLI_ARGS}}gpu{{else}}cpu{{end}}'
      DEVICE: '{{if contains "gpu" .CLI_ARGS}}cuda{{else}}cpu{{end}}'
      GPU_COUNT: '{{if contains "gpu" .CLI_ARGS}}all{{else}}0{{end}}'
      STAGE: '{{if contains "prod" .CLI_ARGS}}prod{{else}}development{{end}}'
      VERSION: "{{.VERSION}}"
      VITE_API_URL: ${VITE_API_URL}

  up:
    desc: "Поднять стек (task up -- [gpu] [prod] [public])"
    cmds:
      - task: data:create
      - >
        {{.COMPOSE}} -f docker-compose.yml
        {{if not (contains "prod" .CLI_ARGS)}}-f docker-compose.dev.yml{{end}}
        {{if contains "gpu" .CLI_ARGS}}-f docker-compose.gpu.yml{{end}}
        {{if contains "public" .CLI_ARGS}}--profile domain{{end}}
        up -d
      - task: ps
    env:
      BUILD_TARGET: '{{if contains "gpu" .CLI_ARGS}}gpu{{else}}cpu{{end}}'
      DEVICE: '{{if contains "gpu" .CLI_ARGS}}cuda{{else}}cpu{{end}}'
      GPU_COUNT: '{{if contains "gpu" .CLI_ARGS}}all{{else}}0{{end}}'
      STAGE: '{{if contains "prod" .CLI_ARGS}}prod{{else}}development{{end}}'
      VERSION: "{{.VERSION}}"
      VITE_API_URL: ${VITE_API_URL}

  down:
    desc: Остановить и удалить контейнеры, включая Caddy если был поднят (данные в data/ сохраняются)
    cmds:
      - "{{.COMPOSE}} --profile domain down"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  version:bump:
    desc: "Увеличить минорную версию (0.2.0 → 0.3.0) в VERSION и пересобрать образ"
    cmds:
      - |
        CURRENT=$(cat VERSION)
        MAJOR=$(echo $CURRENT | cut -d. -f1)
        MINOR=$(echo $CURRENT | cut -d. -f2)
        NEW_MINOR=$((MINOR + 1))
        NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
        echo $NEW_VERSION > VERSION
        echo "Version bumped: $CURRENT → $NEW_VERSION"
      - task: build

  version:set:
    desc: "Установить конкретную версию (task version:set -- 1.0.0)"
    cmds:
      - |
        NEW_VERSION="{{.CLI_ARGS}}"
        CURRENT=$(cat VERSION)
        echo $NEW_VERSION > VERSION
        echo "Version set: $CURRENT → $NEW_VERSION"
      - task: build

  version:show:
    desc: Показать текущую версию
    cmds:
      - |
        echo "Current version: $(cat VERSION)"

  restart:
    desc: "Перезапустить сервис (task restart -- server)"
    cmds:
      - "{{.COMPOSE}} restart {{.CLI_ARGS | default \"server\"}}"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  ps:
    desc: Статус контейнеров
    cmds:
      - "{{.COMPOSE}} ps"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  logs:
    desc: "Логи сервиса, по умолчанию server (task logs -- postgres)"
    cmds:
      - "{{.COMPOSE}} logs -f {{.CLI_ARGS | default \"server\"}}"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  clean:
    desc: Остановить стек и удалить data/postgres, data/qdrant_storage, data/ollama_models, data/caddy_*, data/redis — ОПАСНО
    prompt: Удалить все локальные данные (Postgres/Qdrant/Ollama/Caddy/Redis)?
    cmds:
      - "{{.COMPOSE}} --profile domain down -v"
      - rm -rf data/postgres data/qdrant_storage data/ollama_models data/caddy_data data/caddy_config data/redis
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  # -------------------------------------------------------------------------
  # Модель LLM (Ollama — сервис в docker-compose.yml)
  # -------------------------------------------------------------------------

  pull-model:
    desc: Скачать LLM в контейнер Ollama (по умолчанию — модель из server/.env / LLM_MODEL)
    cmds:
      - "{{.COMPOSE}} exec ollama ollama pull {{.CLI_ARGS | default .LLM_MODEL}}"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  # -------------------------------------------------------------------------
  # Авторизация
  # -------------------------------------------------------------------------

  login:
    desc: "Залогиниться и сохранить токен в .auth_token (task login email=admin@example.com password=...)"
    cmds:
      - >
        curl -sX POST http://localhost:8001/auth/login
        -H "Content-Type: application/json"
        -d "{\"email\": \"{{.email}}\", \"password\": \"{{.password}}\"}"
        -o /tmp/rag_login_response.json
      - cat /tmp/rag_login_response.json | jq .
      - jq -er .access_token /tmp/rag_login_response.json > .auth_token
      - 'echo "Токен сохранён в .auth_token — остальные task-команды подхватят его сами"'

  me:
    desc: Показать текущего авторизованного пользователя
    cmds:
      - >
        curl -s http://localhost:8001/auth/me
        -H "Authorization: Bearer $(cat .auth_token)" | jq .

  user:add:
    desc: "[admin] Завести пользователя (task user:add email=vasya@company.com password=... role=user)"
    cmds:
      - >
        curl -sX POST http://localhost:8001/auth/users
        -H "Authorization: Bearer $(cat .auth_token)"
        -H "Content-Type: application/json"
        -d "{\"email\": \"{{.email}}\", \"password\": \"{{.password}}\", \"role\": \"{{.role | default `user`}}\"}" | jq .

  user:list:
    desc: "[admin] Список всех пользователей"
    cmds:
      - >
        curl -s http://localhost:8001/auth/users
        -H "Authorization: Bearer $(cat .auth_token)" | jq .

  user:toggle:
    desc: "[admin] Активировать/деактивировать пользователя (task user:toggle -- id=1 active=false)"
    cmds:
      - >
        curl -sX PATCH "http://localhost:8001/auth/users/{{.id}}/active"
        -H "Authorization: Bearer $(cat .auth_token)"
        -H "Content-Type: application/json"
        -d "{\"is_active\": {{.active | default `true`}}}" | jq .

  # -------------------------------------------------------------------------
  # Индексация документов (только admin — нужен токен из task login)
  # -------------------------------------------------------------------------

  ingest:
    desc: "[admin] Проиндексировать data/docs_sample/ (только новые/изменённые файлы)"
    cmds:
      - >
        curl -sX POST "http://localhost:8001/ingest?reset=false"
        -H "Authorization: Bearer $(cat .auth_token)" | jq .

  ingest:reset:
    desc: "[admin] Полная переиндексация data/docs_sample/ с нуля"
    cmds:
      - >
        curl -sX POST "http://localhost:8001/ingest?reset=true"
        -H "Authorization: Bearer $(cat .auth_token)" | jq .

  ingest:file:
    desc: "[admin] Проиндексировать один файл (task ingest:file -- /code/project/data/docs_sample/report.pdf)"
    cmds:
      - >
        curl -sX POST "http://localhost:8001/ingest/file?file_path={{.CLI_ARGS}}"
        -H "Authorization: Bearer $(cat .auth_token)" | jq .

  ingest:list:
    desc: "[admin] Реестр уже проиндексированных файлов"
    cmds:
      - >
        curl -s http://localhost:8001/ingest/registry
        -H "Authorization: Bearer $(cat .auth_token)" | jq .

  ingest:upload:
    desc: "[admin] Загрузить файлы в хранилище (task ingest:upload -- file1.pdf file2.docx)"
    cmds:
      - >
        curl -sX POST http://localhost:8001/ingest/upload
        -H "Authorization: Bearer $(cat .auth_token)"
        -F "files=@{{.CLI_ARGS}}" | jq .

  # -------------------------------------------------------------------------
  # Проверка и использование
  # -------------------------------------------------------------------------

  health:
    desc: Проверить статус всех сервисов через /health (без авторизации)
    cmds:
      - curl -s http://localhost:8001/health | jq .

  chat:
    desc: "Задать вопрос синхронно, нужен предварительный task login (task chat -- \"Твой вопрос\")"
    cmds:
      - >
        curl -sX POST http://localhost:8001/chat/sync
        -H "Authorization: Bearer $(cat .auth_token)"
        -H "Content-Type: application/json"
        -d "{\"question\": \"{{.CLI_ARGS}}\"}" | jq .

  bench:
    desc: Запустить оценку качества (retriever + LLM-судья) по data/test_questions.json
    cmds:
      - "{{.COMPOSE}} exec server bash -c 'cd app && python -m presentation.cli benchmark run'"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  bench:regression:
    desc: Benchmark + regression check vs baseline (exit code 1 при regressions)
    cmds:
      - "{{.COMPOSE}} exec server bash -c 'cd app && python -m presentation.cli benchmark regression'"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  bench:history:
    desc: Показать историю последних 10 runs бенчмарка
    cmds:
      - "{{.COMPOSE}} exec server bash -c 'cd app && python -m presentation.cli benchmark history'"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  pdf:diag:
    desc: "Диагностика PDF-файла (task pdf:diag -- /path/to/file.pdf)"
    cmds:
      - "{{.COMPOSE}} exec server bash -c 'cd app && python -m presentation.cli pdf-diag check {{.CLI_ARGS}}'"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  # -------------------------------------------------------------------------
  # База данных
  # -------------------------------------------------------------------------

  db:shell:
    desc: Открыть psql внутри контейнера postgres
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U raguser -d ragdb"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  db:backup:
    desc: Сделать дамп БД в data/db/postgres/backups/
    cmds:
      - mkdir -p data/db/postgres/backups
      - "{{.COMPOSE}} exec -T postgres pg_dump -U raguser ragdb > data/db/postgres/backups/backup_$(date +%F_%H%M%S).sql"
      - 'echo "Дамп сохранён в data/db/postgres/backups/"'
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  db:backup:qdrant:
    desc: Создать снимок Qdrant (snapshot API) в data/qdrant_backups/
    cmds:
      - mkdir -p data/qdrant_backups
      - >
        {{.COMPOSE}} exec -T qdrant curl -s http://localhost:6333/collections
        | jq -r '.result.collections[].name'
      - >
        TIMESTAMP=$(date +%F_%H%M%S) &&
        for COLL in $({{.COMPOSE}} exec -T qdrant curl -s http://localhost:6333/collections | jq -r '.result.collections[].name'); do
          echo "Снимок коллекции $COLL..." &&
          {{.COMPOSE}} exec -T qdrant curl -s -X POST
            "http://localhost:6333/collections/$COLL/snapshots"
            -o "/qdrant/storage/../snapshots/$COLL" 2>/dev/null || true;
        done &&
        {{.COMPOSE}} exec -T qdrant tar czf - /qdrant/snapshots/ > "data/qdrant_backups/qdrant_snapshots_$TIMESTAMP.tar.gz" &&
        echo "Снимки Qdrant сохранены в data/qdrant_backups/"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  db:backup:minio:
    desc: Скопировать бакеты MinIO в data/minio_backups/ (через mc)
    cmds:
      - mkdir -p data/minio_backups
      - >
        TIMESTAMP=$(date +%F_%H%M%S) &&
        {{.COMPOSE}} exec -T minio mc alias set local http://localhost:9000
          "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}" &&
        for BUCKET in $({{.COMPOSE}} exec -T minio mc ls local/ --summarize | awk '{print $NF}' | grep -v '/$'); do
          echo "Копирование бакета $BUCKET..." &&
          {{.COMPOSE}} exec -T minio mc mirror --overwrite "local/$BUCKET" "/data/$BUCKET" 2>/dev/null || true;
        done &&
        tar czf "data/minio_backups/minio_$TIMESTAMP.tar.gz" -C data minio/ &&
        echo "Бакеты MinIO сохранены в data/minio_backups/"

  db:backup:all:
    desc: Бэкап всех данных (Postgres + Qdrant + MinIO)
    cmds:
      - task: db:backup
      - task: db:backup:qdrant
      - task: db:backup:minio
      - 'echo "Полный бэкап завершён"'

  # -------------------------------------------------------------------------
  # Alembic миграции
  # -------------------------------------------------------------------------

  db:migrate:
    desc: "Применить все pending миграции (alembic upgrade head)"
    cmds:
      - "{{.COMPOSE}} exec server alembic upgrade head"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  db:migrate:make:
    desc: "Создать новую миграцию (task db:migrate:make -- \"описание\")"
    aliases: [ mm ]
    cmds:
      - "{{.COMPOSE}} exec server alembic revision --autogenerate -m {{.CLI_ARGS}}"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  db:migrate:current:
    desc: Показать текущую версию миграций
    cmds:
      - "{{.COMPOSE}} exec server alembic current"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  db:migrate:history:
    desc: История миграций
    cmds:
      - "{{.COMPOSE}} exec server alembic history"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  db:migrate:downgrade:
    desc: "Откатить на одну миграцию вниз (alembic downgrade -1)"
    cmds:
      - "{{.COMPOSE}} exec server alembic downgrade -1"
    env:
      STAGE: development
      BUILD_TARGET: cpu
      VERSION: "{{.VERSION}}"

  # -------------------------------------------------------------------------
  # Локальная разработка без Docker (uv)
  # -------------------------------------------------------------------------

  install:
    desc: "Установить зависимости локально через uv (основные + dev: pytest, ruff)"
    dir: server
    cmds:
      - uv sync --frozen --group development --group testing

  install:surya:
    desc: Доустановить опциональный OCR-движок Surya (см. README → «Лицензии»)
    dir: server
    cmds:
      - uv sync --frozen --extra surya

  lock:
    desc: Пересобрать uv.lock после правки pyproject.toml
    dir: server
    cmds:
      - uv lock

  fmt:
    desc: Отформатировать и подчистить код (ruff)
    dir: server
    cmds:
      - uv run ruff format app tests
      - uv run ruff check --fix app tests

  lint:
    desc: Проверить код линтером без изменений
    dir: server
    cmds:
      - uv run ruff check app tests

  test:
    desc: Прогнать unit-тесты (pytest)
    dir: server
    cmds:
      - uv run pytest -v

  # -------------------------------------------------------------------------
  # Нагрузочное тестирование
  # -------------------------------------------------------------------------

  loadtest:setup-users:
    desc: "Создать тестовых пользователей для нагрузочных тестов (task loadtest:setup-users -- count=50)"
    dir: loadtest
    cmds:
      - >
        python3 data/generate_users.py
        --count {{.count | default "50"}}
        --base-url {{.url | default "http://localhost:8001"}}
        {{if .admin_email}}--admin-email {{.admin_email}}{{end}}
        {{if .admin_password}}--admin-password {{.admin_password}}{{end}}

  loadtest:smoke:
    desc: "Smoke test (1-5 VU, 1 мин) — проверка что сценарий работает"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/smoke.js
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:run:
    desc: "Нагрузочный тест (0→500 VU за 5 мин, 10 мин steady)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/load.js
        --out json=/results/results_load_{{now | date "20060102_150405"}}.json
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:spike:
    desc: "Spike test (50→500 VU за 30 сек)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/spike.js
        --out json=/results/results_spike_{{now | date "20060102_150405"}}.json
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:soak:
    desc: "Soak test (200 VU на 1 час — поиск утечек памяти)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/soak.js
        --out json=/results/results_soak_{{now | date "20060102_150405"}}.json
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:breakpoint:
    desc: "Breakpoint test (постепенный рост до отказа)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile k6 run --rm k6
        run /scripts/breakpoint.js
        --out json=/results/results_breakpoint_{{now | date "20060102_150405"}}.json
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'

  loadtest:sse:
    desc: "Locust SSE test — тестирование /chat streaming (task loadtest:sse -- users=200 duration=10m)"
    dir: loadtest
    cmds:
      - >
        docker compose -f docker-compose.loadtest.yml --profile locust run --rm locust
        -f locustfile.py --headless
        --users {{.users | default "200"}}
        --spawn-rate {{.spawn_rate | default "10"}}
        --run-time {{.duration | default "10m"}}
        --csv=/results/locust_{{now | date "20060102_150405"}}
        --html=/results/locust_report_{{now | date "20060102_150405"}}.html
    env:
      BASE_URL: '{{.url | default "http://host.docker.internal:8001"}}'
      LOCUST_USERS: '{{.users | default "200"}}'
      LOCUST_SPAWN_RATE: '{{.spawn_rate | default "10"}}'
      LOCUST_RUN_TIME: '{{.duration | default "10m"}}'

  loadtest:local:
    desc: "Запустить k6 локально (без Docker, если k6 установлен)"
    dir: loadtest/k6
    cmds:
      - "k6 run {{.script | default 'smoke.js'}} {{.CLI_ARGS}}"
    env:
      BASE_URL: '{{.url | default "http://localhost:8001"}}'

  # -------------------------------------------------------------------------
  # Kubernetes (k3d + Helm + Tilt)
  # -------------------------------------------------------------------------

  k3d:create:
    desc: "Создать локальный k3d-кластер для разработки"
    cmds:
      - k3d cluster create rag-dev --config deploy/k3d/cluster-config.yaml
      - kubectl wait --for=condition=Ready node --all --timeout=120s
      - 'echo "k3d cluster rag-dev ready — run: task tilt"'

  k3d:delete:
    desc: "Удалить k3d-кластер"
    cmds:
      - k3d cluster delete rag-dev

  k3d:list:
    desc: "Показать k3d-кластеры"
    cmds:
      - k3d cluster list

  tilt:
    desc: "Запустить Tilt для локальной Kubernetes-разработки"
    cmds:
      - tilt up

  tilt:down:
    desc: "Остановить Tilt"
    cmds:
      - tilt down

  helm:template:
    desc: "Просмотр сгенерированных Kubernetes-манифестов (dry-run)"
    cmds:
      - >
        helm template rag-app ./deploy/helm/rag-app
        -f ./deploy/helm/rag-app/values-dev.yaml
        {{.CLI_ARGS}}

  helm:diff:
    desc: "Показать diff перед обновлением Helm-релиза"
    cmds:
      - >
        helm diff upgrade rag-app ./deploy/helm/rag-app
        -f ./deploy/helm/rag-app/values-dev.yaml
        {{.CLI_ARGS}}

  helm:infra:
    desc: "Поднять инфру в k3d (postgres, redis, qdrant, ollama, minio, ingress)"
    cmds:
      - helm repo add qdrant https://qdrant.github.io/qdrant-helm --force-update
      - helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx --force-update
      - helm repo add otwld https://otwld.github.io/helm-charts --force-update
      - >
        helm upgrade --install rag-app-postgres
        oci://registry-1.docker.io/bitnamicharts/postgresql
        --set auth.username=raguser
        --set auth.password=ragpassword
        --set auth.database=ragdb
        --set primary.persistence.size=2Gi
      - >
        helm upgrade --install rag-app-redis
        oci://registry-1.docker.io/bitnamicharts/redis
        --set auth.password=password
        --set master.persistence.size=1Gi
      - >
        helm upgrade --install rag-app-qdrant qdrant/qdrant
        --set storage.persistence.size=2Gi
      - >
        helm upgrade --install rag-app-ollama otwld/ollama
      - >
        helm upgrade --install rag-app-minio
        oci://registry-1.docker.io/bitnamicharts/minio
        --set auth.rootUser=minioadmin
        --set auth.rootPassword=minioadmin
        --set persistence.size=2Gi
      - >
        helm upgrade --install rag-app-ingress-nginx
        ingress-nginx/ingress-nginx
        --set controller.service.type=LoadBalancer
        --set controller.service.ports.http=80
        --set controller.service.ports.https=443

  helm:upgrade:
    desc: "Обновить Helm-релиз в dev-окружении"
    cmds:
      - >
        helm upgrade --install rag-app ./deploy/helm/rag-app
        -f ./deploy/helm/rag-app/values-dev.yaml
        --set image.repository=registry.localhost:5000/rag-server
        --set image.tag=latest
        --set image.pullPolicy=Always
        --set migrations.enabled=false
        {{.CLI_ARGS}}

  helm:status:
    desc: "Показать статус Helm-релиза"
    cmds:
      - helm status rag-app
      - kubectl get pods -l "app.kubernetes.io/instance=rag-app"

  helm:rollback:
    desc: "Откатить Helm-релиз (task helm:rollback REVISION=1)"
    cmds:
      - helm rollback rag-app {{.REVISION | default "0"}}

  k8s:logs:
    desc: "Просмотр логов API pods"
    cmds:
      - kubectl logs -l "app.kubernetes.io/component=server" --tail=100 -f

  k8s:logs:worker:
    desc: "Просмотр логов worker pods"
    cmds:
      - kubectl logs -l "app.kubernetes.io/component=worker" --tail=100 -f

  k8s:describe:
    desc: "Описание всех pod'ов приложения"
    cmds:
      - kubectl describe pods -l "app.kubernetes.io/instance=rag-app"

  k8s:port-forward:
    desc: "Port-forward к API (localhost:8001)"
    cmds:
      - kubectl port-forward svc/rag-app-server 8001:80

  k8s:migrate:
    desc: "Запустить миграции вручную (вне Helm hook)"
    cmds:
      - kubectl exec -it deployment/rag-app-server -- alembic upgrade head

  k8s:scale:
    desc: "Масштабировать API (task k8s:scale REPLICAS=3)"
    cmds:
      - kubectl scale deployment/rag-app-server --replicas={{.REPLICAS | default "3"}}

  k8s:status:
    desc: "Показать статус всех ресурсов приложения"
    cmds:
      - 'echo "=== Pods ==="'
      - kubectl get pods -l "app.kubernetes.io/instance=rag-app"
      - 'echo "=== Services ==="'
      - kubectl get svc -l "app.kubernetes.io/instance=rag-app"
      - 'echo "=== Ingress ==="'
      - kubectl get ingress -l "app.kubernetes.io/instance=rag-app"
      - 'echo "=== HPA ==="'
      - kubectl get hpa -l "app.kubernetes.io/instance=rag-app"
      - 'echo "=== PDB ==="'
      - kubectl get pdb -l "app.kubernetes.io/instance=rag-app"

  observability:up:
    desc: "Развернуть Prometheus + Grafana + Loki в k3d"
    cmds:
      - helm upgrade --install prometheus prometheus-community/kube-prometheus-stack -n monitoring --create-namespace
      - helm upgrade --install loki grafana/loki-stack -n monitoring
      - 'echo "Prometheus: kubectl port-forward svc/prometheus-kube-prometheus-prometheus 9090 -n monitoring"'
      - 'echo "Grafana:    kubectl port-forward svc/prometheus-grafana 3000 -n monitoring"'

  observability:down:
    desc: "Удалить Prometheus + Grafana + Loki"
    cmds:
      - helm uninstall loki -n monitoring || true
      - helm uninstall prometheus -n monitoring || true
      - kubectl delete namespace monitoring || true