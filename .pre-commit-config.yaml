# Установка:  uv run --frozen --project server --group development --group testing pre-commit install
# Всё, кроме базовых хуков, запускается через `uv run`, поэтому версии
# ruff / mypy / import-linter берутся из uv.lock, а не дублируются здесь.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # обновите: uv run --frozen --project server --group development --group testing pre-commit autoupdate
    hooks:
      - id: check-added-large-files
        # Benchmark seed: corpus documents and question snapshots are committed on purpose.
        exclude: ^server/app/infrastructure/domain_packs/[^/]+/benchmarks/(corpus/|questions\.json$)
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      # 1. Расставляет пустые строки вокруг if/for/while (до ruff format).
      - id: blank-lines
        name: blank lines around if/for/while
        entry: uv run --frozen --project server --group development --group testing python server/tools/blank_lines.py
        language: system
        types: [python]
        files: ^server/(app|tests|tools)/
        exclude: ^server/app/infrastructure/database/migrations/versions/

      # 2. Линтер с автофиксами.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --project server --group development --group testing ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        files: ^server/

      # 3. Форматтер.
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --project server --group development --group testing ruff format
        language: system
        types_or: [python, pyi]
        files: ^server/

      # 4. Типы. Весь проект целиком, потому что mypy нужен полный контекст.
      - id: mypy
        name: mypy
        entry: bash -c 'cd server && uv run --frozen --group development --group testing mypy'
        language: system
        types_or: [python, pyi]
        files: ^server/
        pass_filenames: false

      # 5. Архитектурные контракты DDD.
      - id: import-linter
        name: import-linter (DDD layers)
        entry: bash -c 'cd server && PYTHONPATH=app uv run --frozen --group development --group testing lint-imports'
        language: system
        types: [python]
        files: ^server/
        pass_filenames: false

      # Предупреждение (не блокирует): вопросы benchmark в БД запущенного стенда разошлись
      # с questions.json пакетов. Без поднятого стека пропускается.
      - id: benchmark-seed-check
        name: benchmark seed snapshot
        entry: scripts/benchmark/seed_check_hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      # Перед push — те же проверки, что в .github/workflows/lint.yml (lint, test с PostgreSQL
      # и Redis в Docker, offline-gate, client-test) на чистом checkout пушимого коммита.
      # Пропустить один раз: SKIP_LOCAL_CI=1 git push.
      - id: local-ci
        name: local CI (lint.yml)
        entry: bash -c 'scripts/ci/local.sh "${PRE_COMMIT_TO_REF:-HEAD}"'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

      # --- Frontend ---
      - id: biome-check
        name: biome check
        entry: bash -c 'cd client && npx biome check --staged --no-errors-on-unmatched'
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false

      - id: biome-format
        name: biome format
        entry: bash -c 'cd client && npx biome format --write --staged --no-errors-on-unmatched'
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false

      - id: typecheck
        name: typescript typecheck
        entry: bash -c 'cd client && npx tsc -b --noEmit'
        language: system
        types_or: [ts, tsx, jsx]
        pass_filenames: false
