global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: rag
    authorization:
      credentials_file: /run/secrets/metrics.token
    dns_sd_configs:
      - names: [server]
        type: A
        port: 8001
        refresh_interval: 10s
