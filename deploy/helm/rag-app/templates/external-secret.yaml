{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "rag-app.fullname" . }}-secret
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "rag-app.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.jwtSecretKey }}
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.dbPassword }}
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.qdrantApiKey }}
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.s3AccessKey }}
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.s3SecretKey }}
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.openrouterApiKey }}
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.adminEmail }}
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.adminPassword }}
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPaths.redisPassword }}
{{- end }}
