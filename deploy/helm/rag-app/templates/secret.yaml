apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-app.fullname" . }}-secret
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
