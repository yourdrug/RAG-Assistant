{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rag-app.fullname" . }}-server
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rag-app.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 8001
          protocol: TCP
  egress:
    - to: []
      ports:
        - port: 5432
          protocol: TCP
        - port: 6333
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 11434
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rag-app.fullname" . }}-worker
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rag-app.worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - port: 5432
          protocol: TCP
        - port: 6333
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 11434
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
