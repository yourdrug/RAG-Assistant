apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-app.fullname" . }}-worker
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "rag-app.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-app.worker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      shareProcessNamespace: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "rag-app.fullname" . }}-config
            - secretRef:
                name: {{ include "rag-app.fullname" . }}-secret
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, time
                  hb = "/tmp/worker-heartbeat"
                  if not os.path.exists(hb):
                      raise SystemExit("no heartbeat")
                  age = time.time() - os.path.getmtime(hb)
                  if age > 120:
                      raise SystemExit(f"stale heartbeat: {age:.0f}s")
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: heartbeat
              mountPath: /tmp
            - name: data
              mountPath: /code/project/data
        - name: heartbeat-sidecar
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                if pgrep -f "python.*main.py.*worker" > /dev/null 2>&1; then
                  date +%s > /tmp/worker-heartbeat
                fi
                sleep 30
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: heartbeat
              mountPath: /tmp
              readOnly: true
      volumes:
        - name: heartbeat
          emptyDir: {}
        - name: data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
