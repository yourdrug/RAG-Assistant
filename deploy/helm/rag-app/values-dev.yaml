# Dev overrides — local k3d cluster, single replica
server:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "3Gi"
  autoscaling:
    enabled: false
  pdb:
    enabled: false

worker:
  enabled: true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

migrations:
  enabled: true

config:
  logLevel: DEBUG
  allowedOrigins: "*"
  llmProvider: ollama
  llmModel: "qwen2.5:7b"
  fileBackend: local
  workerMaxConcurrent: "2"

secrets:
  jwtSecretKey: "dev-jwt-secret-not-for-production"
  dbPassword: ragpassword
  qdrantApiKey: qdrant_api_key
  s3AccessKey: minioadmin
  s3SecretKey: minioadmin
  adminEmail: admin
  adminPassword: admin
  redisPassword: password

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: rag.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgres:
  enabled: true
  external: false
  host: rag-app-postgres-postgresql
  password: ragpassword

redis:
  enabled: true
  external: false
  host: rag-app-redis-master
  password: password

qdrant:
  enabled: true
  external: false
  host: rag-app-qdrant
  apiKey: qdrant_api_key

ollama:
  enabled: true
  external: false

tei:
  enabled: true
  external: false

minio:
  enabled: true
  external: false
