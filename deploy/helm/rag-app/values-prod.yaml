# Production overrides — external stateful components, managed services
image:
  tag: "0.5.0"
  pullPolicy: IfNotPresent

server:
  replicas: 3
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "6Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2

worker:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "3Gi"
  pdb:
    enabled: true
    minAvailable: 1
  keda:
    enabled: true
    pollingInterval: 15
    cooldownPeriod: 60
    idleReplicaCount: 0
    minReplicaCount: 2
    maxReplicaCount: 20
    queueLength: 5
    fallbackReplicas: 2

config:
  logLevel: INFO
  llmProvider: openrouter
  fileBackend: s3
  workerMaxConcurrent: "8"
  dbHost: ""        # Set via external secret / managed DB
  redisHost: ""     # Set via external secret / managed Redis
  qdrantUrl: ""     # Set via external secret / Qdrant Cloud

# Production: secrets from External Secrets Operator (Vault)
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef: vault-backend
  secretStoreKind: ClusterSecretStore
  vaultPaths:
    jwtSecretKey: secret/data/rag-app/jwt-secret-key
    dbPassword: secret/data/rag-app/db-password
    qdrantApiKey: secret/data/rag-app/qdrant-api-key
    s3AccessKey: secret/data/rag-app/s3-access-key
    s3SecretKey: secret/data/rag-app/s3-secret-key
    openrouterApiKey: secret/data/rag-app/openrouter-api-key
    adminEmail: secret/data/rag-app/admin-email
    adminPassword: secret/data/rag-app/admin-password
    redisPassword: secret/data/rag-app/redis-password

secrets:
  # Placeholder — real values come from ExternalSecret -> Vault
  jwtSecretKey: ""
  dbPassword: ""
  qdrantApiKey: ""
  s3AccessKey: ""
  s3SecretKey: ""
  openrouterApiKey: ""
  adminEmail: ""
  adminPassword: ""
  redisPassword: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: rag.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rag-tls
      hosts:
        - rag.example.com

observability:
  metrics:
    enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRules:
    enabled: true
  grafanaDashboard:
    enabled: true
  opentelemetry:
    enabled: true
  tempo:
    enabled: true
    endpoint: "tempo-distributor.observability.svc.cluster.local:4317"
    insecure: false

# Production: all stateful components are external/managed
namespace:
  create: true

podSecurity:
  enabled: true
  enforce: restricted
  audit: restricted
  warn: restricted

postgres:
  enabled: false
  external: true
  host: ""     # Set via external secret (e.g. CloudSQL, RDS)
  port: 5432
  user: raguser
  database: ragdb
  password: ""

redis:
  enabled: false
  external: true
  host: ""     # Set via external secret (e.g. ElastiCache, Memorystore)
  port: 6379
  password: ""

qdrant:
  enabled: false
  external: true
  host: ""     # Set via external secret (e.g. Qdrant Cloud)
  port: 6333
  apiKey: ""

ollama:
  enabled: false
  external: true
  host: ""
  port: 11434

tei:
  enabled: false
  external: true
  embed:
    host: ""
    port: 8080
  rerank:
    host: ""
    port: 8080

minio:
  enabled: false
  external: true
  host: ""     # Set via external secret (e.g. S3-compatible)
  port: 9000
