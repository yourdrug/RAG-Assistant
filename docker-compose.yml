services:
  qdrant:
    image: qdrant/qdrant:latest
    hostname: qdrant
    container_name: rag-qdrant
    # Qdrant доступен ТОЛЬКО внутри Docker-сети (rag-network).
    # Для отладки с хоста: docker exec rag-qdrant curl http://localhost:6333/collections
    # или временно раскомментировать ports ниже.
    expose:
      - "6333/tcp"
    # ports:
    #   - name: qdrant-debug
    #     target: 6333
    #     published: 6333
    #     host_ip: 127.0.0.1
    #     protocol: tcp
    #     mode: host
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_api_key}
    volumes:
      - type: bind
        source: ./data/qdrant_storage
        target: /qdrant/storage
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    container_name: rag-ollama
    # Ollama не умеет в собственную авторизацию — доступ ТОЛЬКО внутри Docker-сети.
    # Для отладки с хоста: docker exec rag-ollama ollama list
    # или временно раскомментировать ports ниже.
    expose:
      - "11434/tcp"
    # ports:
    #   - name: ollama-debug
    #     target: 11434
    #     published: 11435
    #     host_ip: 127.0.0.1
    #     protocol: tcp
    #     mode: host
    volumes:
      - type: bind
        source: ./data/ollama_models
        target: /root/.ollama
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 5m   # не держать модель в памяти бесконечно после запроса
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 14G
        reservations:
          cpus: "2"
          memory: 4G
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-0}
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: rag-postgres
    user: root
    entrypoint: [ "/usr/local/bin/docker-entrypoint.sh" ]
    command: [ "postgres", "-c", "config_file=/etc/postgres/postgresql.conf" ]
    expose:
      - "5432/tcp"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    # App user (raguser) and database (ragdb) are created by init.sql.
    volumes:
      - type: bind
        source: ./data/db/postgres/postgresql.conf
        target: /etc/postgres/postgresql.conf
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/db/postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test:
        - "CMD"
        - "psql"
        - |
          host=postgres
          port=5432
          user=postgres
          password=ragpassword
          dbname=postgres
        - "-c"
        - "SELECT 'OK'"
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    deploy:
      resources:
        limits:
          cpus: 0.75
          memory: 4G
        reservations:
          cpus: 0.5
          memory: 500M
    pull_policy: missing
    restart: always

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: development-${BUILD_TARGET:-cpu}
      args:
        BUILD_DATE: ${BUILD_DATE:-}
    hostname: rag-server
    container_name: rag-server
    entrypoint: [ "./entrypoint.sh" ]
    command: [ "python", "main.py", "runserver", "--host", "0.0.0.0", "--port", "8001", "--reload" ]
    ports:
      - name: rag-server
        target: 8001
        published: 8001
        host_ip: 0.0.0.0
        protocol: tcp
        mode: host
    env_file:
      - path: server/.env
        required: true
    environment:
      DEVICE: ${DEVICE:-cpu}
    volumes:
      - type: bind
        source: server/app
        target: /code/project/app
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: server/entrypoint.sh
        target: /code/project/entrypoint.sh
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: data
        target: /code/project/data
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: volume
        source: huggingface_cache
        target: /root/.cache/huggingface
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 16G
        reservations:
          cpus: "1"
          memory: 4G
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-0}
              capabilities: [gpu]
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: rag-minio
    command: server /data --console-address ":9001"
    ports:
      - name: minio-api
        target: 9000
        published: 9000
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
      - name: minio-console
        target: 9001
        published: 9001
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - type: bind
        source: ./data/minio
        target: /data
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    hostname: rag-client
    container_name: rag-client
    expose:
      - "80/tcp"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    hostname: caddy
    container_name: rag-caddy
    profiles: [ "domain" ]
    ports:
      - name: caddy-http
        target: 80
        published: 80
        host_ip: 0.0.0.0
        protocol: tcp
        mode: host
      - name: caddy-https
        target: 443
        published: 443
        host_ip: 0.0.0.0
        protocol: tcp
        mode: host
    environment:
      DOMAIN: ${DOMAIN:-myapp.rag}
      ACME_EMAIL: ${ACME_EMAIL:-postmaster@myapp.rag}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/caddy_certs
        target: /etc/caddy/certs
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/caddy_data
        target: /data
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/caddy_config
        target: /config
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: rag-network
    driver: bridge
    driver_opts:
      # По умолчанию Docker-мост держит MTU=1500. Если на хосте поднят VPN (обычно
      # снижает MTU до ~1400 и меньше), крупные TLS-пакеты при долгих скачиваниях рвутся
      # с "EOF" — см. README → Troubleshooting.
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1500}

volumes:
  huggingface_cache:
