services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    hostname: qdrant
    container_name: rag-qdrant
    # Qdrant доступен ТОЛЬКО внутри Docker-сети (rag-network).
    # Для отладки с хоста: docker exec rag-qdrant curl http://localhost:6333/collections
    # или временно раскомментировать ports ниже.
    expose:
      - "6333/tcp"
    env_file:
      - path: server/.env
        required: true
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - type: bind
        source: ./data/qdrant_storage
        target: /qdrant/storage
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 500M
    restart: unless-stopped
    networks:
      - backend

  ollama:
    image: ollama/ollama:0.9.5
    hostname: ollama
    container_name: rag-ollama
    # Ollama не умеет в собственную авторизацию — доступ ТОЛЬКО внутри Docker-сети.
    # Для отладки с хоста: docker exec rag-ollama ollama list
    # или временно раскомментировать ports ниже.
    expose:
      - "11434/tcp"
    # ports:
    #   - name: ollama-debug
    #     target: 11434
    #     published: 11435
    #     host_ip: 127.0.0.1
    #     protocol: tcp
    #     mode: host
    volumes:
      - type: bind
        source: ./data/ollama_models
        target: /root/.ollama
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 5m   # не держать модель в памяти бесконечно после запроса
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 5G
        reservations:
          cpus: "1"
          memory: 2G
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: postgres:16.4-alpine
    hostname: postgres
    container_name: rag-postgres
    user: root
    entrypoint: [ "/usr/local/bin/docker-entrypoint.sh" ]
    command: [ "postgres", "-c", "config_file=/etc/postgres/postgresql.conf" ]
    expose:
      - "5432/tcp"
    env_file:
      - path: server/.env
        required: true
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - type: bind
        source: ./data/db/postgres/postgresql.conf
        target: /etc/postgres/postgresql.conf
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/db/postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test:
        - "CMD"
        - "psql"
        - |
          host=postgres
          port=5432
          user=raguser
          password=ragpassword
          dbname=ragdb
        - "-c"
        - "SELECT 'OK'"
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1.5G
        reservations:
          cpus: 0.25
          memory: 256M
    pull_policy: missing
    restart: always
    networks:
      - backend

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: rag-redis
    user: root
    entrypoint: [ "/usr/local/bin/docker-entrypoint.sh" ]
    command:
      [
        "redis-server",
        "/etc/redis/redis.conf",
        "--user redis on >password ~* &* +@all",
        "--user default off nopass -@all",
        "--requirepass password",
      ]
    expose:
      - "6379/tcp"
    volumes:
      - type: bind
        source: ./data/redis/redis.conf
        target: /etc/redis/redis.conf
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./data/redis
        target: /data
        read_only: false
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-h",
          "redis",
          "-p",
          "6379",
          "--user",
          "redis",
          "--pass",
          "password",
          "ping",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1.5G
        reservations:
          cpus: 0.25
          memory: 256M
    restart: always
    networks:
      - backend

  server:
    image: rag-server:${STAGE}-${BUILD_TARGET}-${VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${STAGE}-${BUILD_TARGET}
    hostname: rag-server
    container_name: rag-server
    ports:
      - "0.0.0.0:8001:8001"
    env_file:
      - path: server/.env
        required: true
    volumes:
      - type: bind
        source: ./data/paddleocr_cache
        target: /root/.paddleocr
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 2G
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tei-embed:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - backend

  worker:
    image: rag-server:${STAGE}-${BUILD_TARGET}-${VERSION}
    hostname: rag-worker
    container_name: rag-worker
    env_file:
      - path: server/.env
        required: true
    volumes:
      - type: bind
        source: ./data
        target: /code/project/data
        bind:
          propagation: rprivate
          create_host_path: true
      - type: bind
        source: ./data/paddleocr_cache
        target: /root/.paddleocr
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      tei-embed:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped
    networks:
      - default
      - backend
    command: [ "python", "main.py", "worker" ]

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    hostname: tei-embed
    container_name: rag-tei-embed
    command: --model-id /data/bge-m3 --port 8080
    expose:
      - "8080/tcp"
    volumes:
      - type: bind
        source: ./data/tei_cache
        target: /data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped
    networks:
      - backend

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    hostname: tei-rerank
    container_name: rag-tei-rerank
    command: --model-id /data/bge-reranker-v2-m3 --port 8080
    expose:
      - "8080/tcp"
    volumes:
      - type: bind
        source: ./data/tei_cache
        target: /data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped
    networks:
      - default
      - backend

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    hostname: minio
    container_name: rag-minio
    command: server /data --console-address ":9001"
    ports:
      - name: minio-api
        target: 9000
        published: 9000
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
      - name: minio-console
        target: 9001
        published: 9001
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
    env_file:
      - path: server/.env
        required: true
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - type: bind
        source: ./data/minio
        target: /data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    hostname: rag-client
    container_name: rag-client
    ports:
      - name: rag-client
        target: 80
        published: 3001
        host_ip: 0.0.0.0
        protocol: tcp
        mode: host
    environment:
      VITE_API_URL: ${VITE_API_URL}
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:80" ]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped

  caddy:
    image: caddy:2.9.1-alpine
    hostname: caddy
    container_name: rag-caddy
    profiles: [ "domain" ]
    ports:
      - name: caddy-http
        target: 80
        published: 80
        host_ip: 0.0.0.0
        protocol: tcp
        mode: host
      - name: caddy-https
        target: 443
        published: 443
        host_ip: 0.0.0.0
        protocol: tcp
        mode: host
    environment:
      DOMAIN: ${DOMAIN:-myapp.rag}
      ACME_EMAIL: ${ACME_EMAIL:-postmaster@myapp.rag}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/caddy_certs
        target: /etc/caddy/certs
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./data/caddy_data
        target: /data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./data/caddy_config
        target: /config
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: rag-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_MTU}
  backend:
    name: rag-backend
    driver: bridge
    internal: true
