x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-database: &pooled-database
  PYTHONPATH: /code/project/app
  DB_HOST: pgbouncer
  DB_PORT: "5432"
  DB_USE_PGBOUNCER: "true"
  DB_DIRECT_HOST: ${DB_HOST:-postgres}
  DB_DIRECT_PORT: ${DB_PORT:-5432}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}

services:
  gateway:
    image: nginx:1.27.5-alpine
    logging: *bounded-logging
    stop_grace_period: 60s
    ports:
      # Public entry point: UI at /, backend API at /api/* (also for third-party API clients).
      # PUBLIC_BIND_ADDRESS=127.0.0.1 hides it behind a host reverse proxy.
      # deploy.sh sets 0 (ephemeral port) during the one-time legacy frontend handoff.
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_HOST_PORT:-3001}:80"
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
      NGINX_ENVSUBST_FILTER: TRUSTED_PROXY_CIDR
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    volumes:
      - ./deploy/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/gateway-live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    logging: *bounded-logging
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
      - ./.deploy/metrics.token:/run/secrets/metrics.token:ro
    restart: unless-stopped
    networks:
      - backend

  # Distributed traces (OpenTelemetry): OTEL_ENABLED=true, OTEL_EXPORTER_ENDPOINT=http://jaeger:4318.
  # In-memory storage; UI on 127.0.0.1:16686.
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    profiles: ["tracing"]
    logging: *bounded-logging
    ports:
      - "127.0.0.1:16686:16686"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    networks:
      - default
      - backend

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    logging: *bounded-logging
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-raguser}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-ragdb}
      AUTH_TYPE: scram-sha-256
      STATS_USERS: ${DB_USER:-raguser}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-60}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      QUERY_WAIT_TIMEOUT: "30"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$DB_USER\" -d \"$$DB_NAME\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.11.0
    profiles: ["monitoring"]
    logging: *bounded-logging
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: "host=pgbouncer port=5432 dbname=pgbouncer sslmode=disable connect_timeout=5"
      PGUSER: ${DB_USER:-raguser}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.12.1
    logging: *bounded-logging
    hostname: qdrant
    container_name: rag-qdrant
    # Qdrant доступен ТОЛЬКО внутри Docker-сети (rag-network).
    # Для отладки с хоста: docker exec rag-qdrant curl http://localhost:6333/collections
    # или временно раскомментировать ports ниже.
    expose:
      - "6333/tcp"
    env_file:
      - path: server/.env
        required: true
      - path: server/.env.secrets
        required: false
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    volumes:
      - type: bind
        source: ./data/qdrant_storage
        target: /qdrant/storage
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 500M
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: postgres:16.4-alpine
    logging: *bounded-logging
    hostname: postgres
    container_name: rag-postgres
    user: root
    entrypoint: [ "/usr/local/bin/docker-entrypoint.sh" ]
    command: [ "postgres", "-c", "config_file=/etc/postgres/postgresql.conf" ]
    expose:
      - "5432/tcp"
    env_file:
      - path: server/.env
        required: true
      - path: server/.env.secrets
        required: false
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ragdb
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - type: bind
        source: ./data/db/postgres/postgresql.conf
        target: /etc/postgres/postgresql.conf
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/db/postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test:
        - "CMD"
        - "psql"
        - |
          host=postgres
          port=5432
          user=raguser
          password=${DB_PASSWORD:?DB_PASSWORD is required}
          dbname=ragdb
        - "-c"
        - "SELECT 'OK'"
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1.5G
        reservations:
          cpus: 0.25
          memory: 256M
    pull_policy: missing
    restart: always
    networks:
      - backend

  redis:
    image: redis:7-alpine
    logging: *bounded-logging
    hostname: redis
    container_name: rag-redis
    user: root
    entrypoint: [ "/usr/local/bin/docker-entrypoint.sh" ]
    command:
      [
        "redis-server",
        "/etc/redis/redis.conf",
        "--maxmemory-policy noeviction",
        "--appendonly yes",
        "--appendfsync everysec",
        "--dir /data",
        "--user redis on >${REDIS_PASSWORD:?REDIS_PASSWORD is required} ~* &* +@all",
        "--user default off nopass -@all",
        "--requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    expose:
      - "6379/tcp"
    volumes:
      - type: bind
        source: ./data/redis/redis.conf
        target: /etc/redis/redis.conf
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./data/redis
        target: /data
        read_only: false
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-h",
          "redis",
          "-p",
          "6379",
          "--user",
          "redis",
          "--pass",
          "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
          "ping",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1.5G
        reservations:
          cpus: 0.25
          memory: 256M
    restart: always
    networks:
      - backend

  migrate:
    image: ${SERVER_IMAGE:-rag-server:${STAGE}-${BUILD_TARGET}-${VERSION}}
    logging: *bounded-logging
    env_file:
      - path: server/.env
        required: true
      - path: server/.env.secrets
        required: false
    entrypoint: [ ]
    command: [ "python", "app/scripts/migrate.py" ]
    environment:
      PYTHONPATH: /code/project/app
      STAGE: ${APP_STAGE:-${STAGE:-development}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  server:
    image: ${SERVER_IMAGE:-rag-server:${STAGE}-${BUILD_TARGET}-${VERSION}}
    logging: *bounded-logging
    # Stateless and horizontally scalable (SERVER_REPLICAS): no fixed container
    # name or host port; nginx resolves the service name to every replica.
    stop_grace_period: 60s
    env_file:
      - path: server/.env
        required: true
      - path: server/.env.secrets
        required: false
      - path: .deploy/metrics.env
        required: false
    environment:
      <<: *pooled-database
      STAGE: ${APP_STAGE:-${STAGE:-development}}
    volumes:
      - type: bind
        source: ./data/paddleocr_cache
        target: /home/raguser/.paddleocr
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      # Keep the UI available for administration when RAG dependencies are degraded.
      # /ready continues to report whether the full RAG pipeline is ready.
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8001/live" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 2G
      replicas: ${SERVER_REPLICAS:-1}
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - backend

  worker:
    image: ${SERVER_IMAGE:-rag-server:${STAGE}-${BUILD_TARGET}-${VERSION}}
    logging: *bounded-logging
    # Documents queue (process/delete); scale with WORKER_REPLICAS.
    stop_grace_period: 120s
    env_file:
      - path: server/.env
        required: true
      - path: server/.env.secrets
        required: false
      - path: .deploy/metrics.env
        required: false
    environment:
      <<: *pooled-database
      STAGE: ${APP_STAGE:-${STAGE:-development}}
    healthcheck:
      test: ["CMD", "python", "-m", "infrastructure.worker_health", "background_tasks"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - type: bind
        source: ./data/paddleocr_cache
        target: /home/raguser/.paddleocr
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      # Primary OCR path: wait for the model when the ocr-vl profile is enabled; ignored otherwise.
      ocr-vl:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          cpus: "4"
          # 4G covers in-process PaddleOCR; with ocr-vl the worker only renders pages and calls HTTP.
          memory: ${WORKER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: "1"
          memory: 1G
      replicas: ${WORKER_REPLICAS:-1}
    restart: unless-stopped
    networks:
      - default
      - backend
    command: [ "python", "main.py", "worker", "--role", "documents" ]

  worker-batch:
    image: ${SERVER_IMAGE:-rag-server:${STAGE}-${BUILD_TARGET}-${VERSION}}
    logging: *bounded-logging
    # Batch queue (ingest, benchmark, sweep); scale with WORKER_BATCH_REPLICAS.
    # Cluster-wide caps per job type are enforced at claim, not per replica.
    stop_grace_period: 120s
    env_file:
      - path: server/.env
        required: true
      - path: server/.env.secrets
        required: false
      - path: .deploy/metrics.env
        required: false
    environment:
      <<: *pooled-database
      STAGE: ${APP_STAGE:-${STAGE:-development}}
    healthcheck:
      test: ["CMD", "python", "-m", "infrastructure.worker_health", "batch_tasks"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - type: bind
        source: ./data/paddleocr_cache
        target: /home/raguser/.paddleocr
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      # Primary OCR path: wait for the model when the ocr-vl profile is enabled; ignored otherwise.
      ocr-vl:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          cpus: "4"
          # 4G covers in-process PaddleOCR; with ocr-vl the worker only renders pages and calls HTTP.
          memory: ${WORKER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: "1"
          memory: 1G
      replicas: ${WORKER_BATCH_REPLICAS:-1}
    restart: unless-stopped
    networks:
      - default
      - backend
    command: [ "python", "main.py", "worker", "--role", "batch" ]

  maintenance:
    image: ${SERVER_IMAGE:-rag-server:${STAGE}-${BUILD_TARGET}-${VERSION}}
    logging: *bounded-logging
    # Cron, durable job relay and vector outbox. Replicas are safe: cron runs are
    # deduplicated by fixed Arq job IDs and relays/outbox claim rows with SKIP LOCKED.
    stop_grace_period: 120s
    env_file:
      - path: server/.env
        required: true
      - path: server/.env.secrets
        required: false
      - path: .deploy/metrics.env
        required: false
    environment:
      <<: *pooled-database
      STAGE: ${APP_STAGE:-${STAGE:-development}}
      # Fewer glibc arenas for the outbox's embedding threads: measured ~100 MiB lower peak and resident memory.
      MALLOC_ARENA_MAX: "2"
    healthcheck:
      test: ["CMD", "python", "-m", "infrastructure.worker_health", "maintenance_tasks"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - type: bind
        source: ./data/paddleocr_cache
        target: /home/raguser/.paddleocr
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 256M
      replicas: ${MAINTENANCE_REPLICAS:-1}
    restart: unless-stopped
    networks:
      - default
      - backend
    command: [ "python", "main.py", "worker", "--role", "maintenance" ]

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    logging: *bounded-logging
    profiles: [ "tei" ]
    hostname: tei-embed
    container_name: rag-tei-embed
    command: --model-id /data/bge-m3 --port 8080
    expose:
      - "8080/tcp"
    volumes:
      - type: bind
        source: ./data/tei_cache
        target: /data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped
    networks:
      - backend

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    logging: *bounded-logging
    profiles: [ "tei" ]
    hostname: tei-rerank
    container_name: rag-tei-rerank
    command: --model-id /data/bge-reranker-v2-m3 --port 8080
    environment:
      OMP_NUM_THREADS: "4"
      ORT_NUM_THREADS: "4"
    expose:
      - "8080/tcp"
    volumes:
      - type: bind
        source: ./data/tei_cache
        target: /data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped
    networks:
      - default
      - backend

  minio:
    # Keep the service name and data path for existing endpoints and backups.
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    logging: *bounded-logging
    hostname: minio
    container_name: rag-minio
    command: server /data --console-address ":9001"
    ports:
      - name: minio-api
        target: 9000
        published: 9000
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
      # Web console is public (PUBLIC_BIND_ADDRESS); the S3 API above stays local.
      - name: minio-console
        target: 9001
        published: 9001
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
        mode: host
    env_file:
      - path: server/.env
        required: true
      - path: server/.env.secrets
        required: false
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - type: bind
        source: ./data/minio
        target: /data
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE:-rag-client:${VERSION}}
    logging: *bounded-logging
    stop_grace_period: 60s
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      TRUSTED_PROXY_CIDR: gateway
      NGINX_ENVSUBST_FILTER: "UPSTREAM_SERVER|TRUSTED_PROXY_CIDR|NGINX_RESOLVER"
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    depends_on:
      gateway:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:80" ]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped

  # ── Opt-in GPU services (profiles; `task up -- vllm` / `task up -- ocr-vl`) ──────────────
  # The backend network has no internet egress: download weights once with
  # `task vllm:models` / `task ocr-vl:models`. On a 6 GB GPU run only one of them at a time.

  # Local LLM via vLLM (OpenAI-compatible API). Then in Admin → Settings:
  #   Model connections → LLM endpoint: URL = http://vllm:8000/v1, answer model = $VLLM_MODEL
  # and add "http://vllm:8000" to ML_INTERNAL_ALLOWED_ORIGINS in server/.env.
  # Defaults fit a 6 GB Turing GPU (RTX 2060): 4-bit AWQ 3B, fp16 activations (no bf16 on Turing).
  # VLLM_MAX_MODEL_LEN must cover the RAG budget max(llm_num_ctx_narrow, llm_num_ctx_broad);
  # switching the provider fails validation otherwise.
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.10.1.1}
    logging: *bounded-logging
    profiles: [ "vllm" ]
    hostname: vllm
    container_name: rag-vllm
    gpus: all
    ipc: host
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}
      - --served-model-name=${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}
      - --dtype=${VLLM_DTYPE:-half}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-8}
      - --enforce-eager
      - --host=0.0.0.0
      - --port=8000
    environment:
      # Optional: VLLM_API_KEY enables auth; then set the same LLM_API_KEY in server/.env.secrets.
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      HF_HUB_OFFLINE: "1"
    expose:
      - "8000/tcp"
    volumes:
      - vllm_models:/root/.cache/huggingface
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
    restart: unless-stopped
    networks:
      - backend

  # Primary OCR path; scale independently of document workers on the available GPUs.
  ocr-vl:
    build: ./services/ocr_vl
    image: ${OCR_VL_IMAGE:-rag-ocr-vl:latest}
    logging: *bounded-logging
    profiles: [ "ocr-vl" ]
    hostname: ocr-vl
    # Every replica loads the model on all visible GPUs: keep one replica per GPU host.
    gpus: all
    deploy:
      replicas: ${OCR_VL_REPLICAS:-1}
    environment:
      # GPUs without bf16 (Turing, e.g. RTX 2060 6 GB): load the VL model in fp16 instead of fp32.
      OCR_VL_FP16_FALLBACK: ${OCR_VL_FP16_FALLBACK:-0}
      # Per-block pixel cap for the VL model; 501760 keeps 300 DPI pages within 6 GB. Empty = library default.
      OCR_VL_MAX_PIXELS: ${OCR_VL_MAX_PIXELS:-}
    expose:
      - "8080/tcp"
    volumes:
      - ocr_vl_models:/root/.paddlex
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
    restart: unless-stopped
    networks:
      - backend

volumes:
  prometheus_data:
  vllm_models:
  ocr_vl_models:

networks:
  default:
    name: rag-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1500}
  backend:
    name: rag-backend
    driver: bridge
    internal: true
